      description: 创建租户套餐（资源上限，0 表示不限）。编码全局唯一，统一转小写存储且不可修改。
      parameters:
      - description: 套餐信息（编码、名称与各项上限）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.CreatePlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，返回套餐信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 套餐编码已存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建套餐
      tags:
      - 租户运营
  /tenant-plans/{id}:
    delete:
      description: 删除未被任何租户使用的套餐；仍被租户使用时返回 409，避免租户静默失去配额约束。
      parameters:
      - description: 套餐 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: 套餐不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 套餐仍被租户使用
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除套餐
      tags:
      - 租户运营
    put:
      consumes:
      - application/json
      description: 更新套餐名称与各项上限；编码不可修改。修改后对使用该套餐的租户立即生效。
      parameters:
      - description: 套餐 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 要更新的字段（为空表示不修改）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.UpdatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 套餐不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新套餐
      tags:
      - 租户运营
  /tenants:
    get:
      description: 分页获取租户列表。支持按 ID、编码、创建时间排序。
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，最大 100）
        in: query
        name: page_size
        type: integer
      - description: 排序字段（支持 id、code、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回分页租户列表
          schema:
            $ref: '#/definitions/contract.PageResponse'
        "400":
          description: 参数错误（如无效的排序字段）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取租户列表
      tags:
      - 租户管理
    post:
      consumes:
      - application/json
      description: 创建新租户。编码全局唯一，仅允许字母、数字、短横线和下划线（统一转小写存储）；创建后编码不可修改。
      parameters:
      - description: 租户信息（编码和名称）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，返回租户信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（编码格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 租户编码已存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建租户
      tags:
      - 租户管理
  /tenants/{id}:
    delete:
      description: 软删除指定租户。默认租户受保护，不可删除。
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 默认租户不可删除
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除租户
      tags:
      - 租户管理
    get:
      description: 根据租户 ID 获取租户详细信息。
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回租户信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取租户详情
      tags:
      - 租户管理
    put:
      consumes:
      - application/json
      description: 更新指定租户的名称或状态。编码不可修改。默认租户可改名但不可删除。
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 要更新的租户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.UpdateTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新租户信息
      tags:
      - 租户管理
  /tenants/{id}/plan:
    put:
      consumes:
      - application/json
      description: 为指定租户分配套餐；plan_id=0 表示取消套餐（取消后不再受配额限制）。超限时不影响既有数据，只阻止继续创建。
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 套餐 ID（0=取消套餐）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.AssignPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 分配成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 套餐不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 为租户分配套餐
      tags:
      - 租户运营
  /tenants/usage:
    get:
      description: 返回当前租户的套餐与各资源用量（用户/角色/API Key）及上限，用于容量自查；未分配套餐时 plan 为 null 且不限量。
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回套餐与用量
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前租户用量
      tags:
      - 租户运营
  /users:
    get:
      description: 分页获取用户列表。支持按 ID、用户名、创建时间排序，可指定升序或降序。
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，最大 100）
        in: query
        name: page_size
        type: integer
      - description: 排序字段（支持 id、username、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回分页用户列表
          schema:
            $ref: '#/definitions/contract.PageResponse'
        "400":
          description: 参数错误（如无效的排序字段或排序方向）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 创建新用户账户。用户名必须唯一，密码需符合强度要求（8-32位，包含字母和数字）。支持幂等性保护（通过 Idempotency-Key
        请求头）。
      parameters:
      - description: 用户信息（用户名和密码）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，返回用户信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（如用户名格式不符、密码强度不足）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 用户名已存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户管理
  /users/{id}:
    delete:
      description: 软删除指定用户。删除后用户数据仍保留在数据库中，但无法登录系统。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功，无返回内容
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户管理
    get:
      description: 根据用户 ID 获取用户详细信息。不包含密码等敏感字段。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回用户信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: 更新指定用户的信息（如状态）。部分字段支持部分更新。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 要更新的用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新用户信息
      tags:
      - 用户管理
  /users/batch-delete:
    post:
      consumes:
      - application/json
      description: 批量软删除用户（单次最多 100 个）。返回成功/失败计数。
      parameters:
      - description: 要删除的用户 ID 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.BatchDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 操作完成，返回 success/failed 计数
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 批量删除用户
      tags:
      - 用户管理
  /users/export.csv:
    get:
      description: 导出所有用户为 CSV 文件。列：ID、用户名、状态、创建时间。
      parameters:
      - description: 排序字段（支持 id、username、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV 文件
          schema:
            type: file
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 导出用户列表（CSV）
      tags:
      - 用户管理
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
