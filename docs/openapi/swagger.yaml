basePath: /api/v1
definitions:
  application.AssignPermissionsRequest:
    properties:
      permission_ids:
        items:
          type: integer
        type: array
    required:
    - permission_ids
    type: object
  application.BatchDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
    required:
    - ids
    type: object
  application.CreatePermissionRequest:
    properties:
      action:
        type: string
      name:
        type: string
      resource:
        type: string
    required:
    - action
    - name
    - resource
    type: object
  application.CreateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  application.CreateUserRequest:
    properties:
      password:
        maxLength: 32
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  application.UpdatePermissionRequest:
    properties:
      action:
        type: string
      name:
        type: string
      resource:
        type: string
    required:
    - action
    - name
    - resource
    type: object
  application.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  application.UpdateUserRequest:
    properties:
      status:
        enum:
        - 0
        - 1
        type: integer
    type: object
  contract.ErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
      request_id:
        type: string
    type: object
  contract.PageResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      request_id:
        type: string
      total:
        type: integer
    type: object
  interfaces.loginRequest:
    properties:
      captcha_code:
        type: string
      captcha_id:
        description: 验证码（登录时可选，注册时如果开启验证码则必填）
        type: string
      password:
        description: 密码（8-32 位，必须包含字母和数字）
        maxLength: 32
        minLength: 8
        type: string
      username:
        description: 用户名（4-20 位字母、数字或下划线）
        maxLength: 20
        minLength: 4
        type: string
    required:
    - password
    - username
    type: object
  interfaces.refreshRequest:
    properties:
      refresh_token:
        description: 刷新令牌（从登录或刷新接口获取）
        type: string
    required:
    - refresh_token
    type: object
  response.Body:
    properties:
      code:
        type: integer
      data: {}
      details: {}
      message:
        type: string
      request_id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Jimu 后端框架 API - 提供用户认证、权限管理、角色管理、系统监控等功能
  title: Jimu API
  version: "1.0"
paths:
  /admin/error-codes:
    get:
      description: 获取所有业务错误码及其对应的 HTTP 状态码映射。用于前端和第三方系统集成时参考。包含错误码、错误消息、HTTP 状态码和分类信息。
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回错误码列表
          schema:
            $ref: '#/definitions/response.Body'
      summary: 获取错误码列表
      tags:
      - 系统管理
  /admin/status:
    get:
      description: 获取运行时系统状态信息，包括：版本号、运行环境（dev/prod）、启动时间、运行时长、Goroutine 数量、CPU 核心数、内存使用情况（已分配、总分配、系统内存、GC
        次数、堆分配、堆使用）。
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回系统状态信息
          schema:
            $ref: '#/definitions/response.Body'
      summary: 获取系统状态
      tags:
      - 系统管理
  /admin/users/{user_id}/logout:
    post:
      description: 强制指定用户的所有会话下线。删除该用户在 Redis 中的所有会话数据，使其在所有设备上需要重新登录。需要管理员权限。
      parameters:
      - description: 要强制下线的用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 强制用户下线
      tags:
      - 系统管理
  /admin/users/online:
    get:
      description: 获取当前在线用户列表。从 Redis 中扫描所有活跃的会话信息，返回用户 ID、用户名和会话 ID。需要管理员权限。
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回在线用户列表
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取在线用户列表
      tags:
      - 系统管理
  /audits:
    get:
      description: 分页获取系统审计日志。记录用户的操作行为（如登录、创建、修改、删除等），用于安全审计和行为追踪。支持按 ID、创建时间排序。
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，最大 100）
        in: query
        name: page_size
        type: integer
      - description: 排序字段（支持 id、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回分页审计日志列表
          schema:
            $ref: '#/definitions/contract.PageResponse'
        "400":
          description: 参数错误（如无效的排序字段）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取审计日志列表
      tags:
      - 审计日志
  /audits/{id}:
    get:
      description: 根据审计日志 ID 获取详细信息，包括操作用户、操作类型、资源、详情、IP 地址、HTTP 方法、请求路径和状态码。
      parameters:
      - description: 审计日志 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回审计日志详情
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 审计日志不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取审计日志详情
      tags:
      - 审计日志
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码进行身份验证，成功返回访问令牌和刷新令牌。支持 IP 和用户名维度的限流保护。
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/interfaces.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回 accessToken 和 refreshToken
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（用户名或密码格式不符）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "401":
          description: 认证失败（用户名或密码错误）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "429":
          description: 请求过于频繁，请稍后再试
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 撤销当前会话的刷新令牌，使其失效。需要有效的访问令牌进行身份验证。
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 未认证或会话无效
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 退出当前会话
      tags:
      - 认证
  /auth/logout-all:
    post:
      description: 撤销该用户的所有刷新会话，强制所有设备重新登录。需要有效的访问令牌进行身份验证。
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 未认证或会话无效
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 退出所有会话
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用有效的刷新令牌获取新的访问令牌。刷新令牌轮换机制会同时生成新的刷新令牌，旧的刷新令牌失效。
      parameters:
      - description: 刷新令牌
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/interfaces.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回新的 token 对
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "401":
          description: 刷新令牌无效或已过期
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      summary: 刷新访问令牌
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 注册新用户账户。仅当系统配置中 public_registration 为 true 时可用。支持 IP 维度的限流保护。
      parameters:
      - description: 注册信息（用户名和密码）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/interfaces.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回用户信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（如用户名已存在）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
  /captcha:
    get:
      description: 生成图形验证码，返回 captcha_id 与 base64 图片
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回 captcha_id 和 captcha_image
          schema:
            $ref: '#/definitions/response.Body'
      summary: 获取验证码
      tags:
      - 验证码
  /oauth/{provider}/callback:
    get:
      description: 处理第三方授权回调，签发 JWT
      parameters:
      - description: 提供商
        in: path
        name: provider
        required: true
        type: string
      - description: 授权码
        in: query
        name: code
        required: true
        type: string
      - description: 状态
        in: query
        name: state
        required: true
        type: string
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/response.Body'
      summary: OAuth 回调
      tags:
      - OAuth
  /oauth/{provider}/login:
    get:
      description: 重定向到第三方授权页
      parameters:
      - description: 提供商 (google/github/wechat)
        in: path
        name: provider
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: OAuth 登录跳转
      tags:
      - OAuth
  /permissions:
    get:
      description: 分页获取权限列表。支持按 ID、名称、资源路径、操作类型、创建时间排序。
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，最大 100）
        in: query
        name: page_size
        type: integer
      - description: 排序字段（支持 id、name、resource、action、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回分页权限列表
          schema:
            $ref: '#/definitions/contract.PageResponse'
        "400":
          description: 参数错误（如无效的排序字段）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取权限列表
      tags:
      - 权限管理
    post:
      consumes:
      - application/json
      description: 创建新权限。权限由资源路径（resource）和操作类型（action）唯一标识，用于控制 API 访问。
      parameters:
      - description: 权限信息（名称、资源路径、操作类型）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，返回权限信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（如名称为空）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 权限已存在（resource + action 重复）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建权限
      tags:
      - 权限管理
  /permissions/{id}:
    delete:
      description: 软删除指定权限。删除后权限数据仍保留在数据库中，但无法分配给角色。
      parameters:
      - description: 权限 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功，无返回内容
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除权限
      tags:
      - 权限管理
    get:
      description: 根据权限 ID 获取权限详细信息，包括资源路径和操作类型。
      parameters:
      - description: 权限 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回权限信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取权限详情
      tags:
      - 权限管理
    put:
      consumes:
      - application/json
      description: 更新指定权限的名称、资源路径或操作类型。
      parameters:
      - description: 权限 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 要更新的权限信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.UpdatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 权限冲突（resource + action 重复）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新权限信息
      tags:
      - 权限管理
  /roles:
    get:
      description: 分页获取角色列表。支持按 ID、名称、创建时间排序。
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，最大 100）
        in: query
        name: page_size
        type: integer
      - description: 排序字段（支持 id、name、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回分页角色列表
          schema:
            $ref: '#/definitions/contract.PageResponse'
        "400":
          description: 参数错误（如无效的排序字段）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取角色列表
      tags:
      - 角色管理
    post:
      consumes:
      - application/json
      description: 创建新角色。角色名称必须唯一，用于权限管理和访问控制。
      parameters:
      - description: 角色信息（名称和描述）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，返回角色信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（如名称为空）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 角色名称已存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - 角色管理
  /roles/{id}:
    delete:
      description: 软删除指定角色。删除后角色数据仍保留在数据库中，但无法分配给用户。
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功，无返回内容
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除角色
      tags:
      - 角色管理
    get:
      description: 根据角色 ID 获取角色详细信息，包括关联的权限列表。
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回角色信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取角色详情
      tags:
      - 角色管理
    put:
      consumes:
      - application/json
      description: 更新指定角色的名称或描述。
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 要更新的角色信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 角色名称已存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新角色信息
      tags:
      - 角色管理
  /roles/{id}/permissions:
    post:
      consumes:
      - application/json
      description: 为指定角色分配权限。传入权限 ID 数组，角色将被赋予这些权限。原有权限会被替换。
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 权限 ID 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.AssignPermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 分配成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效或权限不存在）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 分配角色权限
      tags:
      - 角色管理
  /users:
    get:
      description: 分页获取用户列表。支持按 ID、用户名、创建时间排序，可指定升序或降序。
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，最大 100）
        in: query
        name: page_size
        type: integer
      - description: 排序字段（支持 id、username、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回分页用户列表
          schema:
            $ref: '#/definitions/contract.PageResponse'
        "400":
          description: 参数错误（如无效的排序字段或排序方向）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 创建新用户账户。用户名必须唯一，密码需符合强度要求（8-32位，包含字母和数字）。支持幂等性保护（通过 Idempotency-Key
        请求头）。
      parameters:
      - description: 用户信息（用户名和密码）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，返回用户信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（如用户名格式不符、密码强度不足）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "409":
          description: 用户名已存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户管理
  /users/{id}:
    delete:
      description: 软删除指定用户。删除后用户数据仍保留在数据库中，但无法登录系统。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功，无返回内容
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户管理
    get:
      description: 根据用户 ID 获取用户详细信息。不包含密码等敏感字段。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回用户信息
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: 更新指定用户的信息（如状态）。部分字段支持部分更新。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 要更新的用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误（ID 格式无效）
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新用户信息
      tags:
      - 用户管理
  /users/batch-delete:
    post:
      consumes:
      - application/json
      description: 批量软删除用户（单次最多 100 个）。返回成功/失败计数。
      parameters:
      - description: 要删除的用户 ID 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/application.BatchDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 操作完成，返回 success/failed 计数
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 批量删除用户
      tags:
      - 用户管理
  /users/export.csv:
    get:
      description: 导出所有用户为 CSV 文件。列：ID、用户名、状态、创建时间。
      parameters:
      - description: 排序字段（支持 id、username、created_at，默认 id）
        in: query
        name: sort
        type: string
      - description: 排序方向（asc 或 desc，默认 desc）
        in: query
        name: order
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV 文件
          schema:
            type: file
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/contract.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 导出用户列表（CSV）
      tags:
      - 用户管理
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
