# Jimu Backend Framework - 测试环境配置
# 通过 JIMU_ENV=test 激活，覆盖 app.yaml 中的同名配置

# HTTP 服务配置
http:
  host: "0.0.0.0"       # 监听地址
  port: 8080             # 监听端口
  mode: "test"           # Gin 模式：测试环境

# 数据库配置 (MariaDB)
db:
  host: "127.0.0.1"      # 数据库地址
  port: 3306             # 数据库端口
  user: "root"           # 用户名
  password: "root"       # 密码
  database: "jimu_test"  # 测试数据库名（与生产隔离）
  max_open: 10           # 最大连接数（测试环境可较小）
  max_idle: 5            # 最大空闲连接数

# Redis 配置
redis:
  addr: "127.0.0.1:6379" # Redis 地址
  password: ""           # Redis 密码
  db: 1                  # Redis 数据库编号（与开发的 0 隔离）

# 日志配置
log:
  level: "debug"         # 日志级别：测试环境使用 debug
  format: "console"      # 日志格式：控制台输出便于查看
  output: "stdout"       # 输出到 stdout
  max_size: 100          # 单文件最大大小（MB）
  max_backups: 30        # 保留旧文件数
  max_age: 7             # 保留天数
  compress: true         # 是否压缩旧文件

# 认证配置
auth:
  jwt_secret: "test-secret-key"  # 测试用 JWT 密钥
  access_expire_min: 30          # Access Token 有效期（分钟）
  refresh_expire_day: 7          # Refresh Token 有效期（天）

# 服务运行时配置
server:
  timeout_sec: 30        # 请求超时秒数
  rate_limit_rate: 100   # 全局限流速率（每秒请求数）
  rate_limit_burst: 200  # 限流桶容量

# 缓存配置
cache:
  prefix: "jimu_test"    # 缓存 key 前缀（与生产隔离）
