# Jimu Backend Framework - 开发环境配置
# 优先级：环境变量 > app.{env}.yaml > app.yaml

# HTTP 服务配置
http:
  host: "0.0.0.0"       # 监听地址
  port: 8080             # 监听端口
  mode: "debug"          # Gin 模式：debug / release / test
  read_header_timeout_sec: 5
  read_timeout_sec: 15
  write_timeout_sec: 30
  idle_timeout_sec: 60
  shutdown_timeout_sec: 30
  max_body_bytes: 1048576
  trusted_proxies: ["127.0.0.1"]
  allowed_origins: ["http://localhost:3000"]

management:
  host: "127.0.0.1"
  port: 9090
  enable_pprof: false
  probe_timeout_sec: 2

# 数据库配置 (MariaDB)
db:
  host: "127.0.0.1"         # 数据库地址
  port: 3306                # 数据库端口
  user: "root"              # 用户名
  password: "root"          # 密码
  database: "jimu"          # 数据库名
  max_open: 100             # 最大连接数
  max_idle: 10              # 最大空闲连接数
  conn_max_lifetime_sec: 3600  # 连接最大存活时间（秒）
  conn_max_idle_time_sec: 600  # 连接最大空闲时间（秒）
  max_retries: 5            # 连接重试次数
  retry_interval_sec: 3     # 重试间隔（秒）

# Redis 配置
redis:
  addr: "127.0.0.1:6379"    # Redis 地址
  password: ""              # Redis 密码（无密码留空）
  db: 0                     # Redis 数据库编号
  pool_size: 20             # 连接池大小
  min_idle_conns: 5         # 最小空闲连接数
  read_timeout_sec: 3       # 读超时（秒）
  write_timeout_sec: 3      # 写超时（秒）
  max_retries: 5            # 连接重试次数
  retry_interval_sec: 3     # 重试间隔（秒）

# 日志配置
log:
  level: "debug"         # 日志级别：debug / info / warn / error
  format: "console"      # 日志格式：console / json
  output: "stdout"       # 输出目标：stdout 或文件路径（如 logs/app.log）
  max_size: 100          # 单文件最大大小（MB），仅文件输出时生效
  max_backups: 30        # 保留旧文件数，仅文件输出时生效
  max_age: 7             # 保留天数，仅文件输出时生效
  compress: true         # 是否压缩旧文件，仅文件输出时生效

# 认证配置
auth:
  jwt_secret: "change-me-in-production"  # JWT 密钥（生产环境必须修改）
  issuer: "jimu"
  access_expire_min: 30                 # Access Token 有效期（分钟）
  refresh_expire_day: 7                 # Refresh Token 有效期（天）
  public_registration: false
  login_rate_limit: 10
  login_rate_window_sec: 60
  register_rate_limit: 5
  register_rate_window_sec: 300

# 服务运行时配置
server:
  timeout_sec: 30        # 请求超时秒数，0 表示不限制
  rate_limit_rate: 100   # 全局限流速率（每秒请求数），0 表示不限流
  rate_limit_burst: 200  # 限流桶容量，允许的突发请求数

# 缓存配置
cache:
  prefix: "jimu"         # 缓存 key 前缀，多实例部署时用于隔离

audit:
  queue_size: 256
  batch_size: 50
  flush_interval_ms: 500

# 文件存储配置
storage:
  type: "local"           # local, s3, oss, minio
  base_dir: "storage"     # 本地存储目录
  base_url: "/files"      # 访问 URL 前缀

# OpenTelemetry 追踪配置
otel:
  enabled: false                    # 开发环境默认关闭
  endpoint: "localhost:4317"       # OTLP gRPC 端点
  service_name: "jimu"
  service_version: "dev"
  sample_rate: 0.1                  # 采样率：dev 0.1, prod 1.0
