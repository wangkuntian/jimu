http:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"

db:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "root"
  database: "jimu"
  max_open: 100
  max_idle: 10

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

log:
  level: "debug"
  format: "console"
  output: "stdout"
  max_size: 100        # MB，单文件最大大小
  max_backups: 30      # 保留旧文件数
  max_age: 7           # 保留天数
  compress: true       # 旧文件压缩

auth:
  jwt_secret: "change-me-in-production"
  access_expire_min: 30
  refresh_expire_day: 7

server:
  timeout_sec: 30
  rate_limit_rate: 100
  rate_limit_burst: 200

cache:
  prefix: "jimu"
