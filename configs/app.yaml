# Jimu Backend Framework - 开发环境配置
# 优先级：环境变量 > app.{env}.yaml > app.yaml
# 完整配置项（含注释），便于独立查阅

# HTTP 服务配置
http:
  host: "0.0.0.0"       # 监听地址
  port: 8080             # 监听端口
  mode: "debug"          # Gin debug 模式（详细错误信息，便于调试）
  read_header_timeout_sec: 5
  read_timeout_sec: 15
  write_timeout_sec: 30
  idle_timeout_sec: 60
  shutdown_timeout_sec: 30
  max_body_bytes: 1048576  # 1MB
  trusted_proxies: ["127.0.0.1"]
  allowed_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
  # TLS / mTLS：client_ca_file 非空时要求并校验客户端证书（双向认证）
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_ca_file: ""

management:
  host: "127.0.0.1"      # 仅本地访问（安全）
  port: 9090
  enable_pprof: true     # 开发环境启用 pprof（性能分析）
  probe_timeout_sec: 2

# 数据库配置 (MariaDB)
db:
  driver: "mysql"           # 数据库驱动：mysql / postgres / mariadb（可通过 DB_DRIVER 覆盖）
  host: "127.0.0.1"         # 数据库地址（可通过 DB_HOST 覆盖）
  port: 3306                # 数据库端口（可通过 DB_PORT 覆盖；postgres 默认 5432）
  user: "jimu"              # 用户名（可通过 DB_USER 覆盖）
  password: ""              # 密码（通过 DB_PASSWORD 环境变量覆盖）
  database: "jimu"          # 数据库名（可通过 DB_NAME 覆盖）
  max_open: 25              # 最大连接数（开发环境较小）
  max_idle: 5               # 最大空闲连接数
  conn_max_lifetime_sec: 3600  # 连接最大存活时间（秒）
  conn_max_idle_time_sec: 600  # 连接最大空闲时间（秒）
  max_retries: 3            # 连接重试次数（开发环境快速失败）
  retry_interval_sec: 1     # 重试间隔（秒）
  # 时间统一按 UTC 存储与读取（连接固定 loc=UTC + 会话 time_zone=+00:00，PostgreSQL TimeZone=UTC），不可配置
  # 读写分离（开发环境通常不需要）
  # read_hosts: ["mariadb-read-1"]
  # read_ports: [3306]
  breaker:                  # 熔断：DB 不可用时快速失败（读写分离启用时自动跳过）
    enabled: true
    max_failures: 5         # 连续失败阈值
    reset_timeout_sec: 10   # 冷却时间（秒）

# Redis 配置
redis:
  mode: "single"            # Redis 部署模式：single / sentinel / cluster（高可用）
  addr: "127.0.0.1:6379"    # 单机模式地址（可通过 REDIS_ADDR 覆盖）
  password: ""              # Redis 密码（可通过 REDIS_PASSWORD 覆盖）
  db: 0                     # Redis 数据库编号（可通过 REDIS_DB 覆盖；cluster 模式不支持）
  master_name: ""           # 哨兵模式：master 名称
  sentinel_addrs: []        # 哨兵模式：哨兵节点地址列表
  sentinel_password: ""     # 哨兵模式：哨兵节点密码（可选）
  cluster_addrs: []         # 集群模式：节点地址列表
  pool_size: 10             # 连接池大小（开发环境较小）
  min_idle_conns: 2         # 最小空闲连接数
  read_timeout_sec: 3       # 读超时（秒）
  write_timeout_sec: 3      # 写超时（秒）
  max_retries: 3            # 连接重试次数
  retry_interval_sec: 1     # 重试间隔（秒）
  breaker:                  # 熔断：Redis 不可用时快速失败
    enabled: true
    max_failures: 5         # 连续失败阈值
    reset_timeout_sec: 10   # 冷却时间（秒）

# 限流维度（全局 IP 令牌桶见 server.rate_limit_*）
ratelimit:
  tenant:                   # 租户维度（Redis 滑动窗口；平台级视角 tid=0 跳过）
    enabled: false
    limit: 6000             # 每窗口允许请求数
    window_sec: 60          # 窗口大小（秒）

# 数据保留（清理增长型历史表；默认关闭，启用前请确认合规要求）
retention:
  enabled: false
  cron: "30 3 * * *"        # 调度表达式
  batch_size: 500           # 每批删除行数
  audit_log_days: 180       # 审计日志保留天数（0=不清理）
  job_days: 7               # 已终态任务保留天数
  job_history_days: 30      # 任务执行历史保留天数
  dead_letter_days: 30      # 已处理死信保留天数
  outbox_event_days: 7      # 已发布 outbox 事件保留天数
  import_job_days: 90       # 已结束导入任务保留天数
  trusted_device_days: 7    # 失效可信设备保留天数（过期后保留审计窗口再清理）

# 日志配置
log:
  level: "debug"         # 日志级别：debug（开发环境详细日志）
  format: "console"      # 日志格式：console（便于终端阅读）
  output: "stdout"       # 输出目标：stdout（输出到终端）
  max_size: 100          # 单文件最大大小（MB，仅文件输出时生效）
  max_backups: 30        # 保留旧文件数（仅文件输出时生效）
  max_age: 7             # 保留天数（仅文件输出时生效）
  compress: true         # 是否压缩旧文件（仅文件输出时生效）

# 认证配置
auth:
  jwt_secret: "dev-secret-do-not-use-in-production"  # JWT 密钥（可通过 JWT_SECRET 覆盖）
  issuer: "jimu"
  access_expire_min: 60  # Access Token 有效期（分钟，开发环境较长方便调试）
  refresh_expire_day: 30 # Refresh Token 有效期（天）
  public_registration: true  # 开发环境允许公开注册（方便测试）
  login_rate_limit: 100      # 登录限流（次/窗口，开发环境宽松）
  login_rate_window_sec: 60  # 登录限流窗口（秒）
  register_rate_limit: 100   # 注册限流（次/窗口）
  register_rate_window_sec: 60 # 注册限流窗口（秒）
  reset_code_ttl_min: 15     # 密码重置验证码有效期（分钟）
  password_history_count: 5      # 防复用：检查最近 N 个历史密码（0=关闭）
  trusted_device_days: 30        # 可信设备有效期（天，0=关闭「记住此设备」）
  breach_check_enabled: false    # 泄露口令检查（HIBP 范围查询，需出网；开启后注册/改密会校验）

  # WebAuthn / 通行密钥（无密码登录；需 HTTPS，本地开发用 localhost）
  webauthn:
    enabled: false
    rp_display_name: "Jimu"
    rp_id: "localhost"                          # 站点有效域（不带 scheme），生产改为你的域名
    rp_origins: ["http://localhost:8080"]       # 允许的浏览器来源（绝对 URL，需与前端页面同源）
    session_ttl_min: 5                          # 挑战有效期（分钟）

# 服务运行时配置
server:
  timeout_sec: 60        # 请求超时秒数（开发环境较长，便于调试）
  rate_limit_rate: 0     # 全局限流速率（0 = 不限流）
  rate_limit_burst: 0    # 限流桶容量（0 = 不限流）
  max_concurrency: 0     # 最大并发处理请求数（0 = 不限制）
  concurrency_wait_ms: 0 # 超限排队等待上限毫秒（0 = 立即拒绝，返回 1010/503）

# 雪花 ID 配置
id:
  worker_id: 0           # worker 编号（0-1023）；本地单实例用默认 0，多实例部署时每个副本需唯一

# 缓存配置
cache:
  prefix: "jimu_dev"     # 缓存 key 前缀（开发环境隔离）

audit:
  queue_size: 64         # 队列大小（开发环境较小）
  batch_size: 10         # 批量写入大小
  flush_interval_ms: 1000 # 刷新间隔（毫秒，开发环境刷新频率低）
  hash_secret: ""        # 审计链 HMAC 密钥（建议生产通过 AUDIT_HASH_SECRET 注入；为空则退化为 SHA-256）

# 文件存储配置
storage:
  type: "local"           # 可选: local, s3, oss, minio
  base_dir: "storage"     # 本地存储目录
  base_url: "/files"      # 访问 URL 前缀
  # endpoint/bucket/access_key/secret_key 用于 s3/oss/minio（本地存储不用）
  endpoint: ""            # 例如 oss-cn-hangzhou.aliyuncs.com（oss）、http://localhost:9000（minio）
  region: ""              # 例如 us-east-1（s3）
  bucket: ""              # 存储桶名称
  access_key: ""          # 访问密钥
  secret_key: ""          # 密钥（生产建议环境变量注入）
  path_style: false       # 路径风格（minio 必须 true）

# 文件上传安全配置
upload:
  clamav:
    enabled: false            # 是否启用 ClamAV 病毒扫描（需运行 clamd）
    address: "127.0.0.1:3310" # clamd 监听地址
    timeout_sec: 10           # 单次扫描超时（秒）

# 队列配置
queue:
  type: "redis"           # 队列类型：redis, kafka, rabbitmq
  # Kafka 队列配置（type=kafka 时使用；容器接线由后续 Plan 2 实现）
  kafka:
    brokers: ["127.0.0.1:9092"]
    topic: "jimu-jobs"
    group_id: "jimu-workers"
  # RabbitMQ 队列配置（type=rabbitmq 时使用；容器接线由后续 Plan 2 实现）
  rabbitmq:
    url: "amqp://guest:guest@127.0.0.1:5672/"
    queue: "jimu-jobs"
    exchange: ""

# Outbox 配置
outbox:
  publisher: "event_bus"     # 发布器类型：event_bus（内存事件总线）, mq（消息队列跨服务发布）

# 调度器配置
scheduler:
  store: "memory"            # 任务定义存储：memory（内存，不持久化）, mysql（MySQL 持久化）

# OAuth 登录配置（第三方登录，默认关闭；enabled 后需填写 client_id/client_secret）
oauth:
  providers:
    google:
      client_id: ""
      client_secret: ""
      redirect_url: "http://localhost:8080/api/v1/oauth/google/callback"
      enabled: false
    github:
      client_id: ""
      client_secret: ""
      redirect_url: "http://localhost:8080/api/v1/oauth/github/callback"
      enabled: false
    # 通用 OIDC（Keycloak/Okta/Auth0/Azure AD 等）：issuer_url 非空即按 OIDC 处理，
    # provider 名可自定义（本例回调为 /api/v1/oauth/keycloak/callback）
    oidc:
      client_id: ""
      client_secret: ""
      redirect_url: "http://localhost:8080/api/v1/oauth/keycloak/callback"
      issuer_url: ""            # 如 https://keycloak.example.com/realms/acme
      scopes: ["openid", "profile", "email"]  # 可选，缺省即这三项
      enabled: false

# 验证码配置
captcha:
  enabled: false           # 是否启用登录/注册验证码
  ttl_min: 5               # 验证码有效期（分钟）

# 邮件通知配置
email:
  enabled: false           # 是否启用真实 SMTP 发送；false 时回退日志渠道
  host: ""                 # SMTP 服务器地址，如 smtp.example.com
  port: 587                # SMTP 端口（25/465/587）
  username: ""             # 认证用户名
  password: ""             # 认证密码（生产建议 EMAIL_PASSWORD 环境变量注入）
  from: ""                 # 发件人地址，如 noreply@example.com

sms:
  enabled: false           # 是否启用真实短信发送；false 时回退日志渠道
  provider: ""             # 短信服务商：aliyun
  api_key: ""              # AccessKey ID（生产建议 SMS_API_KEY 环境变量注入）
  api_secret: ""           # AccessKey Secret（生产建议 SMS_API_SECRET 环境变量注入）
  sign_name: ""            # 短信签名

# 通知渠道配置
notification:
  webhook:
    sign_secret: ""        # Webhook 回调载荷签名密钥（HMAC-SHA256，X-Jimu-Signature）；空则不签名

# 安全配置
security:
  csrf_secret: ""          # CSRF 密钥；非空时启用 CSRF 中间件（Bearer 请求自动跳过）。cookie 认证场景必配
  encryption_key: "dev-encryption-key-change-in-production"  # 字段级加密密钥（AES-256-GCM，≥32 字节；建议 ENCRYPTION_KEY 环境变量注入）；空则明文模式
  # 安全头（留空则使用默认值）
  content_type_options: "nosniff"
  frame_options: "DENY"
  xss_protection: "1; mode=block"
  strict_transport: ""  # 开发环境不启用 HSTS（无 HTTPS）
  content_security_policy: "default-src 'self'"
  referrer_policy: "strict-origin-when-cross-origin"
  permissions_policy: "camera=(), microphone=(), geolocation=()"
  # IP 白名单（CIDR 或单个 IP）；为空表示不限制。客户端 IP 依赖 http.trusted_proxies 正确配置
  ip_allowlist: []
  # 管理端（/api/v1/admin）IP 白名单；为空表示沿用 ip_allowlist
  admin_ip_allowlist: []

  # 幂等中间件：客户端带 Idempotency-Key 时，同键重复请求返回首次结果（5xx 不缓存，可安全重试）
  idempotency_enabled: true
  idempotency_ttl_sec: 86400     # 幂等记录保留时长（秒），默认 24 小时
# OpenTelemetry 可观测性（OpenObserve：统一 日志/指标/追踪）
# 启用后 tracing + metrics + logs 均经 OTLP gRPC 推送到 endpoint。
# 本地起 openobserve（make compose-observability）后置 enabled: true 即可。
otel:
  enabled: false              # 开发环境默认关闭（零开销）
  endpoint: "localhost:5081"  # OpenObserve OTLP gRPC 端点（compose 内为 openobserve:5081）
  service_name: "jimu"
  service_version: "dev"
  sample_rate: 0.1            # 追踪采样率（0.1 = 10%）
  metrics_enabled: true       # 指标推送（Prometheus 指标转 OTLP）
  logs_enabled: true          # 日志推送（zap 转 OTLP logs）
  metrics_interval_sec: 15    # 指标推送间隔（秒）
  # OpenObserve 认证（OTLP/gRPC 要求 Basic Auth + organization header）
  # 与 compose 内 openobserve 服务的 ZO_ROOT_USER_EMAIL/ZO_ROOT_USER_PASSWORD 对应
  auth_email: "admin@jimu.local"
  auth_password: "Admin@12345"
  org_id: "default"           # OpenObserve 组织（默认 default）
  logs_stream_name: "jimu_logs"     # 日志 stream（gRPC stream-name header；OpenObserve 会把非法字符规范为 _；空落默认流 default）
  traces_stream_name: "jimu_traces" # 追踪 stream（空落默认流 default）

# 出站 HTTP client 配置（oauth/webhook 等外部调用统一使用）
http_client:
  timeout_sec: 10         # 单次请求超时（秒）
  max_retries: 2          # 失败重试次数（仅网络错误与 5xx）
  retry_interval_ms: 200  # 重试基础间隔（毫秒），指数退避
  max_failures: 5         # 连续失败次数达此值熔断，0 用默认 5
  reset_timeout_ms: 30000 # 熔断后冷却时长（毫秒），0 用默认 30000
  rate_limit_rate: 0      # 每秒请求数（按目标 host 独立限流），0 不限流
  rate_limit_burst: 0     # 令牌桶容量，0 用 rate（桶=平均速率）

# 错误上报（启用时输出结构化错误日志，含 trace_id；日志链路接入 OpenObserve 后错误自动汇聚）
error_reporting:
  enabled: false          # 是否启用错误上报（false 时零开销）

# gRPC server 配置（可选；与 HTTP 双栈并存，默认关闭）
grpc:
  enabled: false           # 是否启用 gRPC server
  host: "127.0.0.1"        # 监听地址
  port: 9091               # 监听端口
  timeout_sec: 60          # 单请求处理超时（秒），0=不限；超时返回 DeadlineExceeded
  # TLS / mTLS（与 HTTP 侧同构）
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_ca_file: ""

# 能力开关（v0.3.0 可插拔能力；留空表示全部启用）
# 可选值见 internal/capabilities/catalog；留空时行为与本字段不存在时完全一致。
# 硬依赖自动补齐（如 ["oauth"] 连带启用 auth/user/role/tenant）；受保护能力要求同时启用
# 提供受保护中间件的能力（当前为 auth），否则启动即失败——["user"] 会被拒绝，
# 合法的最小组合之一是 ["auth"]（闭包自动补齐 user/role/tenant/mfa）。
capabilities:
  enabled: []   # 例如 ["user", "role", "permission", "tenant", "auth", "mfa", "passkey", "audit", "admin"]
