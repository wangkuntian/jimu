services:
  mariadb:
    image: mariadb:12.1.2-noble
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-this-root-password}
      MARIADB_DATABASE: jimu
      MARIADB_USER: jimu
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change-this-jimu-db-password}
      TZ: Asia/Shanghai
    volumes:
      - jimu-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    volumes:
      - jimu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JIMU_ENV: prod
      JWT_SECRET: ${JWT_SECRET:-01234567890123456789012345678901}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-19951102}
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  jimu-mariadb-data:
    name: jimu-mariadb-data
  jimu-redis-data:
    name: jimu-redis-data
