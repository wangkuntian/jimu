services:
  mariadb:
    image: mariadb:12.1.2-noble
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-password}
      MARIADB_DATABASE: jimu
      MARIADB_USER: jimu
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-this-jimu-db-password}
      TZ: Asia/Shanghai
    volumes:
      - jimu-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    volumes:
      - jimu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-jimu}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-jimu-db-password}
      DB_NAME: ${DB_NAME:-jimu}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-01234567890123456789012345678901}
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  jimu-mariadb-data:
    name: jimu-mariadb-data
  jimu-redis-data:
    name: jimu-redis-data
