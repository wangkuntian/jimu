services:
  mariadb:
    image: mariadb:12.1.2-noble
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: jimu
      MARIADB_USER: jimu
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Shanghai
    volumes:
      - jimu-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_root_password
      - db_password

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    volumes:
      - jimu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  server:
    image: ${JIMU_IMAGE:-jimu:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: ${COMPOSE_DB_HOST:-mariadb}
      DB_PORT: ${COMPOSE_DB_PORT:-3306}
      DB_USER: ${COMPOSE_DB_USER:-jimu}
      DB_NAME: ${COMPOSE_DB_NAME:-jimu}
      REDIS_ADDR: ${COMPOSE_REDIS_ADDR:-redis:6379}
      REDIS_DB: ${COMPOSE_REDIS_DB:-0}
      # 容器内 expose management 端点（/metrics 等，供外部抓取或调试）
      MANAGEMENT_HOST: "0.0.0.0"
      # OpenObserve 接入：起 observability profile 后置 OTEL_ENABLED=true 即可
      # （tracing/metrics/logs 统一 OTLP gRPC 推送到 openobserve:5081）
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-openobserve:5081}
      # 敏感配置通过文件注入（非环境变量）
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    ports:
      - "127.0.0.1:${HTTP_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_HOST_PORT:-9090}:9090"
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - db_password
      - jwt_secret

  # 可选的 observability profile：OpenObserve 统一承载 日志/指标/追踪/告警/仪表盘
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.2
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_OBSERVE_ROOT_USER_EMAIL:-admin@jimu.local}
      ZO_ROOT_USER_PASSWORD: ${ZO_OBSERVE_ROOT_USER_PASSWORD:-admin}
      ZO_DATA_DIR: /data
      ZO_HTTP_PORT: "5080"
      ZO_GRPC_PORT: "5081"
    volumes:
      - jimu-openobserve-data:/data
    ports:
      # HTTP UI / API（日志 JSON、Prometheus remote write 等）
      - "127.0.0.1:${ZO_OBSERVE_HTTP_PORT:-5080}:5080"
      # OTLP/gRPC（tracing/metrics/logs 推送）
      - "127.0.0.1:${ZO_OBSERVE_GRPC_PORT:-5081}:5081"

volumes:
  jimu-mariadb-data:
    name: ${COMPOSE_MARIADB_VOLUME:-jimu-mariadb-data}
  jimu-redis-data:
    name: ${COMPOSE_REDIS_VOLUME:-jimu-redis-data}
  jimu-openobserve-data:
    name: ${COMPOSE_OPENOBSERVE_VOLUME:-jimu-openobserve-data}

secrets:
  db_root_password:
    file: ${COMPOSE_DB_ROOT_PASSWORD_FILE:-./secrets/db_root_password.txt}
  db_password:
    file: ${COMPOSE_DB_PASSWORD_FILE:-./secrets/db_password.txt}
  jwt_secret:
    file: ${COMPOSE_JWT_SECRET_FILE:-./secrets/jwt_secret.txt}
