services:
  mariadb:
    image: mariadb:12.1.2-noble
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: jimu
      MARIADB_USER: jimu
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Shanghai
    volumes:
      - jimu-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_root_password
      - db_password

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    volumes:
      - jimu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  server:
    image: ${JIMU_IMAGE:-jimu:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: ${COMPOSE_DB_HOST:-mariadb}
      DB_PORT: ${COMPOSE_DB_PORT:-3306}
      DB_USER: ${COMPOSE_DB_USER:-jimu}
      DB_NAME: ${COMPOSE_DB_NAME:-jimu}
      REDIS_ADDR: ${COMPOSE_REDIS_ADDR:-redis:6379}
      REDIS_DB: ${COMPOSE_REDIS_DB:-0}
      # 容器内 expose management 端点供 Prometheus 抓取（默认 app.yaml 绑定 127.0.0.1）
      MANAGEMENT_HOST: "0.0.0.0"
      # 敏感配置通过文件注入（非环境变量）
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    ports:
      - "127.0.0.1:${HTTP_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_HOST_PORT:-9090}:9090"
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - db_password
      - jwt_secret

  # 可选的 observability profile：Prometheus 抓取 /metrics，Grafana 可视化
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - jimu-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9093:9090"
    depends_on:
      server:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - jimu-alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9094:9093"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability"]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - jimu-loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/promtail.yml:/etc/promtail/config.yml:ro
      - ./logs:/app/logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - jimu-grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/jimu.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  jimu-mariadb-data:
    name: ${COMPOSE_MARIADB_VOLUME:-jimu-mariadb-data}
  jimu-redis-data:
    name: ${COMPOSE_REDIS_VOLUME:-jimu-redis-data}
  jimu-prometheus-data:
    name: ${COMPOSE_PROMETHEUS_VOLUME:-jimu-prometheus-data}
  jimu-alertmanager-data:
    name: ${COMPOSE_ALERTMANAGER_VOLUME:-jimu-alertmanager-data}
  jimu-loki-data:
    name: ${COMPOSE_LOKI_VOLUME:-jimu-loki-data}
  jimu-grafana-data:
    name: ${COMPOSE_GRAFANA_VOLUME:-jimu-grafana-data}

secrets:
  db_root_password:
    file: ${COMPOSE_DB_ROOT_PASSWORD_FILE:-./secrets/db_root_password.txt}
  db_password:
    file: ${COMPOSE_DB_PASSWORD_FILE:-./secrets/db_password.txt}
  jwt_secret:
    file: ${COMPOSE_JWT_SECRET_FILE:-./secrets/jwt_secret.txt}
