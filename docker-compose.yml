version: "3.9"

services:
  mariadb:
    image: mariadb:12.1.2-noble
    container_name: jimu-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-jimu}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine
    container_name: jimu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: jimu-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jimu-server
    restart: unless-stopped
    environment:
      JIMU_ENV: ${JIMU_ENV:-prod}
      JIMU__DB__HOST: mariadb
      JIMU__DB__PORT: 3306
      JIMU__DB__USER: root
      JIMU__DB__PASSWORD: ${DB_PASSWORD:-root}
      JIMU__DB__DATABASE: ${DB_DATABASE:-jimu}
      JIMU__REDIS__ADDR: redis:6379
      JIMU__AUTH__JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb_data:
    name: jimu-mariadb-data
  redis_data:
    name: jimu-redis-data
