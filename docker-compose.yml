services:
  mariadb:
    image: mariadb:12.1.2-noble
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: jimu
      MARIADB_USER: jimu
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Shanghai
    volumes:
      - jimu-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_root_password
      - db_password

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    volumes:
      - jimu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  server:
    image: jimu:latest  # 使用预构建镜像（先 make docker-build）
    # 如需 compose 自动构建，注释上一行，取消下面注释
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-jimu}
      DB_NAME: ${DB_NAME:-jimu}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_DB: ${REDIS_DB:-0}
      # 容器内 expose management 端点供 Prometheus 抓取（默认 app.yaml 绑定 127.0.0.1）
      MANAGEMENT_HOST: "0.0.0.0"
      # 敏感配置通过文件注入（非环境变量）
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - db_password
      - jwt_secret

  # 可选的 observability profile：Prometheus 抓取 /metrics，Grafana 可视化
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jimu-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9093:9090"
    depends_on:
      server:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - jimu-grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/jimu.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  jimu-mariadb-data:
    name: jimu-mariadb-data
  jimu-redis-data:
    name: jimu-redis-data
  jimu-prometheus-data:
    name: jimu-prometheus-data
  jimu-grafana-data:
    name: jimu-grafana-data

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
