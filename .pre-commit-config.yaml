# Git pre-commit 钩子配置
# 安装: pip install pre-commit && pre-commit install
# 手动运行全部: pre-commit run --all-files
# 文档: https://pre-commit.com

repos:
  # Go 格式化
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt

  # go vet 全仓检查
  # dnephin 的 go-vet 脚本假设仓库根目录本身是 Go 包（内部 go list 后按目录拼接包名），
  # 本仓库根目录无 .go 文件会误报 "no Go files"，故替换为本地 hook
  - repo: local
    hooks:
      - id: go-vet
        name: go vet ./...
        entry: go vet ./...
        language: system
        files: '\.go$'
        pass_filenames: false

  # golangci-lint（完整静态检查，已覆盖原 go-lint/golint——golint 已弃用且不再维护）
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.7.2
    hooks:
      - id: golangci-lint
        args: [--timeout=5m]
        # 仅检查已暂存文件会更快，但全量更安全:
        # entry: golangci-lint run --new-from-rev=HEAD

  # 通用检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]  # k8s 清单为 --- 分隔的多文档，属标准写法
        exclude: '^deploy/helm/templates/'  # Go template 语法，非纯 YAML，无法解析
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: check-merge-conflict
      - id: mixed-line-ending

  # 防止提交敏感文件
  - repo: local
    hooks:
      - id: no-env-and-secrets
        name: "禁止提交 .env 和 secrets/"
        entry: '错误: .env 或 secrets/ 目录不应提交。请检查 .gitignore。'
        language: fail
        files: '(\.env$|secrets/)'
        types: [file]
