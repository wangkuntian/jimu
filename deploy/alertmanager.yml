# AlertManager 配置（docker-compose observability profile 使用）
global:
  resolve_timeout: 5m

# 告警路由：按 severity 分组分发
route:
  group_by: ["alertname", "job"]
  group_wait: 10s        # 首次告警等待时间（聚合同组）
  group_interval: 30s    # 同组后续告警间隔
  repeat_interval: 4h    # 重复告警间隔
  receiver: "default"

  routes:
    # critical 告警走 webhook + 邮件
    - matchers:
        - severity = "critical"
      receiver: "critical-webhook"
      continue: true

    # warning 告警走 webhook
    - matchers:
        - severity = "warning"
      receiver: "warning-webhook"

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://127.0.0.1:5001/alert"
        send_resolved: true

  - name: "critical-webhook"
    webhook_configs:
      # 替换为实际告警通道（钉钉/飞书/企业微信/Slack 等）
      - url: "http://127.0.0.1:5001/critical"
        send_resolved: true

  - name: "warning-webhook"
    webhook_configs:
      - url: "http://127.0.0.1:5001/warning"
        send_resolved: true

# 告警抑制规则
inhibit_rules:
  # Pod 宕机时抑制该 Pod 的其他告警
  - source_matchers:
      - alertname = "JimuPodDown"
    target_matchers:
      - alertname =~ "JimuHighErrorRate|JimuHighLatency"
    equal: ["pod"]

  # 就绪探针失败时抑制高延迟告警
  - source_matchers:
      - alertname = "JimuReadinessFailing"
    target_matchers:
      - alertname = "JimuHighLatency"
    equal: ["pod"]
