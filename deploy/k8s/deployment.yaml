apiVersion: apps/v1
kind: Deployment
metadata:
  name: jimu-server
  namespace: jimu
  labels:
    app: jimu-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jimu-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jimu-server
    spec:
      # 数据库迁移：主容器启动前执行，避免新版代码连到未迁移的库
      # 迁移失败则 Pod 不就绪，Deployment 不滚动（maxUnavailable: 0）
      initContainers:
        - name: migrate
          image: registry.example.com/jimu:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["./jimu", "migrate", "up"]
          envFrom:
            - configMapRef:
                name: jimu-config
            - secretRef:
                name: jimu-secrets
          volumeMounts:
            - name: configs
              mountPath: /app/configs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: jimu
          # 替换为实际镜像仓库地址；私有 registry 需认证时加 imagePullSecrets
          image: registry.example.com/jimu:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: jimu-config
            - secretRef:
                name: jimu-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: configs
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: configs
          configMap:
            name: jimu-config-files
