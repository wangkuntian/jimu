apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jimu-server
  namespace: jimu
  labels:
    app: jimu-server
spec:
  podSelector:
    matchLabels:
      app: jimu-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 允许来自 ingress controller 的流量
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    # 允许同一 namespace 内的 Pod 访问 management 端口
    - from:
        - podSelector: {}
      ports:
        - port: 9090
    # 允许 Prometheus 抓取 metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
  egress:
    # 允许访问数据库
    - to:
        - podSelector:
            matchLabels:
              app: mariadb
      ports:
        - port: 3306
    # 允许访问 Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    # 允许 DNS 查询
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 允许访问外部 OTLP collector（如配置）
    - to: []
      ports:
        - port: 4317
