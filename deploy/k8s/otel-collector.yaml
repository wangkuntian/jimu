apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: jimu
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      mysql:
        endpoint: ${env:MYSQL_ENDPOINT}
        username: ${env:MYSQL_USER}
        password: ${file:/run/secrets/db_password}
        collection_interval: 15s
      redis:
        endpoint: ${env:REDIS_ENDPOINT}
        collection_interval: 15s
    processors:
      batch:
        send_batch_size: 10000
        timeout: 10s
    exporters:
      otlp/openobserve:
        endpoint: ${env:ZO_OTLP_ENDPOINT}
        tls:
          insecure: true
        headers:
          authorization: "Basic ${env:ZO_AUTH_TOKEN}"
          organization: ${env:ZO_ORG}
    service:
      pipelines:
        metrics:
          receivers: [mysql, redis]
          processors: [batch]
          exporters: [otlp/openobserve]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: jimu
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      volumes:
        - name: config
          configMap:
            name: otel-collector
        - name: db-secret
          secret:
            secretName: jimu-secrets
            items:
              - key: DB_PASSWORD
                path: db_password
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: MYSQL_ENDPOINT
              value: "mariadb:3306"
            - name: MYSQL_USER
              value: "jimu"
            - name: REDIS_ENDPOINT
              value: "redis:6379"
            - name: ZO_OTLP_ENDPOINT
              value: "openobserve:5081"
            - name: ZO_ORG
              value: "default"
            - name: ZO_AUTH_TOKEN
              value: "YWRtaW5AamltdS5sb2NhbDpBZG1pbkAxMjM0NQ=="
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: db-secret
              mountPath: /run/secrets/db_password
              subPath: db_password
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi