apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jimu.labels" . | nindent 4 }}
type: Opaque
stringData:
  db_password: "REPLACE_WITH_ACTUAL_PASSWORD"
  # base64(email:password) of OpenObserve admin, derived from required values
  zo_auth_token: {{ printf "%s:%s" .Values.otel.authEmail .Values.otel.authPassword | b64enc | quote }}
  redis_password: "REPLACE_WITH_ACTUAL_PASSWORD"
  jwt_secret: "REPLACE_WITH_AT_LEAST_32_CHARACTERS_RANDOM"
