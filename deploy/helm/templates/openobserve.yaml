{{- if .Values.openobserve.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: {{ .Release.Namespace }}
  labels:
    app: openobserve
    {{- include "jimu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.openobserve.replicaCount }}
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      containers:
        - name: openobserve
          image: "{{ .Values.openobserve.image.repository }}:{{ .Values.openobserve.image.tag }}"
          imagePullPolicy: {{ .Values.openobserve.image.pullPolicy }}
          env:
            - name: ZO_ROOT_USER_EMAIL
              value: {{ .Values.openobserve.rootEmail | quote }}
            - name: ZO_ROOT_USER_PASSWORD
              value: {{ .Values.openobserve.rootPassword | quote }}
            - name: ZO_DATA_DIR
              value: /data
            - name: ZO_HTTP_PORT
              value: "5080"
            - name: ZO_GRPC_PORT
              value: "5081"
          ports:
            - name: http
              containerPort: 5080
              protocol: TCP
            - name: otlp
              containerPort: 5081
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.openobserve.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openobserve-data
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: {{ .Release.Namespace }}
  labels:
    app: openobserve
    {{- include "jimu.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5080
      targetPort: 5080
      protocol: TCP
    - name: otlp
      port: 5081
      targetPort: 5081
      protocol: TCP
  selector:
    app: openobserve
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openobserve-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: openobserve
    {{- include "jimu.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.openobserve.storage }}
{{- end }}