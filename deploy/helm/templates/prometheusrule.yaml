{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.prometheusRule.namespace }}
  labels:
    {{- include "jimu.labels" . | nindent 4 }}
    release: prometheus
spec:
  groups:
    - name: jimu.rules
      rules:
        - alert: JimuHighErrorRate
          expr: |
            sum(rate(jimu_http_requests_total{job="{{ .Release.Name }}",status=~"5.."}[5m]))
            / sum(rate(jimu_http_requests_total{job="{{ .Release.Name }}"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "5xx 错误率超过 5%"
            description: "5xx 错误率 {{ "{{ $value | humanizePercentage }}" }}"

        - alert: JimuHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(jimu_http_request_duration_seconds_bucket{job="{{ .Release.Name }}"}[5m])) by (le)) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P95 延迟超过 1 秒"

        - alert: JimuPodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="jimu"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod 频繁重启"

        - alert: JimuPodDown
          expr: |
            kube_pod_status_ready{namespace="{{ .Release.Namespace }}",container="jimu",condition="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod 不可用"

        - alert: JimuDBPoolHigh
          expr: |
            jimu_db_in_use_connections / jimu_db_max_open_connections > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "数据库连接池使用率超过 80%"
{{- end }}
