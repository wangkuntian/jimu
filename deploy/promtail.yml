server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: jimu-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: jimu-server
          app: jimu
          __path__: /app/logs/*.log

  - job_name: docker-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          app: jimu
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            log: log
      - output:
          source: log