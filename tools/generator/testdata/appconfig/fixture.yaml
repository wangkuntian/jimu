# fixture 头部注释（归属紧随其后的第一个段 http，恒被保留）
http:
  host: "0.0.0.0"
  port: 8080
  # 段内注释：其后仍有缩进行，归属 http
  mode: "debug"

"db":
  driver: "mysql"

# 队列段前的独立注释组（归属 queue）
queue:
  type: "redis"
  kafka:
    brokers: ["127.0.0.1:9092"]

scheduler:
  store: "memory"

# 保留段注释（随 retention 段一起被裁掉）
retention:
  enabled: false

storage:
  type: "local"
  base_dir: "storage"

notification:
  webhook:
    sign_secret: ""

capabilities:
  enabled: []
# fixture 尾部注释（挂在最后一个段之后，绝不丢弃）
