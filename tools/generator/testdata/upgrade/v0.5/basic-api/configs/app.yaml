http:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"
  read_header_timeout_sec: 5
  read_timeout_sec: 15
  write_timeout_sec: 30
  idle_timeout_sec: 60
  shutdown_timeout_sec: 15
  max_body_bytes: 1048576
  trusted_proxies: ["127.0.0.1"]
  allowed_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]

management:
  host: "127.0.0.1"
  port: 9090
  enable_pprof: false
  probe_timeout_sec: 1

log:
  level: "info"
  format: "console"
  output: "stdout"
  max_size: 100
  max_backups: 30
  max_age: 7
  compress: true
