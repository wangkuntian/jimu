# golangci-lint v2 配置
# 文档: https://golangci-lint.run/docs/configuration/file/
# 版本与 CI 保持一致 (v2.7.2+)
version: "2"

run:
  timeout: 5m
  go: "1.26.5"
  modules-download-mode: readonly

linters:
  enable:
    - errcheck        # 未检查的错误返回
    - govet           # Go 官方静态分析
    - ineffassign     # 无效赋值
    - staticcheck     # 高级静态分析 (honnef.co)
    - unused          # 未使用代码
    - misspell       # 拼写错误
    - whitespace      # 行尾空白
    - bodyclose       # HTTP response body 未关闭
    - noctx           # HTTP 请求未带 context
    - sqlclosecheck   # SQL rows/statement 未关闭
    - err113          # 禁止 errors.New 动态字符串，要求稳定错误

  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.Writer).Write
    staticcheck:
      checks:
        - all

  exclusions:
    generated: lax
    rules:
      # 既有代码使用动态错误字符串/直接比较错误，P1 统一迁移
      - linters:
          - err113
        path: (internal|tools)/
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx
      - path: tools/generator/
        linters:
          - unused
      # 既有代码缺少 package comment，P1 统一补充
      - linters:
          - staticcheck
        text: "ST1000"
      - path: cmd/
        linters:
          - gofmt
          - goimports

formatters:
  enable:
    - gofmt          # 格式检查
    - goimports      # import 排序

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
  sort-order:
    - linter
    - file
  show-stats: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
