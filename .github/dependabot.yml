version: 2
updates:
  # Go 依赖：先按家族分组（同族必须一起动，故不设 update-types），再用兜底组收长尾 minor/patch。
  # Dependabot 把依赖分配给「第一个匹配的组」，所以家族组必须在兜底组之前。
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dependency-updates"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
          - "github.com/aws/smithy-go"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
      google:
        patterns:
          - "google.golang.org/*"
          - "cloud.google.com/*"
      prometheus:
        patterns:
          - "github.com/prometheus/*"
          - "github.com/beorn7/perks"
          - "github.com/cespare/xxhash/*"
      aliyun:
        patterns:
          - "github.com/alibabacloud-go/*"
          - "github.com/aliyun/*"
      clickhouse:
        patterns:
          - "github.com/ClickHouse/*"
          - "github.com/go-faster/*"
      gin:
        patterns:
          - "github.com/gin-gonic/*"
          - "github.com/gin-contrib/*"
      gorm:
        patterns:
          - "gorm.io/*"
      casbin:
        patterns:
          - "github.com/casbin/*"
      redis:
        patterns:
          - "github.com/redis/*"
          - "github.com/alicebob/miniredis*"
      excelize:
        patterns:
          - "github.com/xuri/*"
      swagger:
        patterns:
          - "github.com/swaggo/*"
      # 兜底：未命中家族组的 minor/patch 合成一个 PR；major 不兜底，仍单独开以人工评估
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions：单个 ["*"] 组收掉全部（原先只匹配 actions/*，漏掉 golangci-lint-action、
  # trivy-action、action-gh-release 等）
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dependency-updates"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        # 与家族组不同：这里的组只收 minor/patch，major 单独开 PR 供人工评估
        update-types:
          - "minor"
          - "patch"

  # Dockerfile 镜像：用 ["*"] 避免写死镜像名后新增镜像漏管。
  # 注意：`docker` 生态**只读** Dockerfile/Containerfile（按文件名匹配），**不读**
  # docker-compose.yml —— compose 内的镜像由下面独立的 `docker-compose` 生态覆盖。
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dependency-updates"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "*"
        # 与家族组不同：这里的组只收 minor/patch，major 单独开 PR 供人工评估
        update-types:
          - "minor"
          - "patch"

  # Docker Compose 镜像（docker-compose.yml）：`docker` 生态不覆盖它，必须独立声明。
  # 原先写死的 mariadb/redis/adminer 三个 pattern 之所以从未匹配，正是因为这些镜像只出现在
  # compose 与 deploy/backup/Dockerfile 里。
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "dependency-updates"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-compose-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
