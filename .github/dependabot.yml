version: 2
updates:
  # Go 依赖
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # 将同一库的多个升级合并为一个 PR
      gin:
        patterns:
          - "github.com/gin-gonic/*"
      gorm:
        patterns:
          - "gorm.io/*"
      casbin:
        patterns:
          - "github.com/casbin/*"
      go-redis:
        patterns:
          - "github.com/redis/go-redis/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "actions/*"
