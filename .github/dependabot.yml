version: 2
updates:
  # Go 依赖
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dependabot-updates"
    schedule:
      interval: "weekly"
      day: "monday"
    # Version updates are run by the Release Issue-driven official CLI.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # 将同一库的多个升级合并为一个 PR
      gin:
        patterns:
          - "github.com/gin-gonic/*"
      gorm:
        patterns:
          - "gorm.io/*"
      casbin:
        patterns:
          - "github.com/casbin/*"
      go-redis:
        patterns:
          - "github.com/redis/go-redis/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dependabot-updates"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "actions/*"

  # Docker 镜像
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dependabot-updates"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "golang"
          - "alpine"
          - "mariadb"
          - "redis"
          - "adminer"
