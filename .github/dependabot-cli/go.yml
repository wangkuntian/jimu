{
  "job": {
    "package-manager": "go_modules",
    "experiments": {"goprivate": "", "gonoproxy": "none", "gonosumdb": "none"},
    "allowed-updates": [{"dependency-type": "direct", "update-type": "all"}],
    "commit-message-options": {"prefix": "chore", "include-scope": true},
    "source": {"provider": "github", "directory": "/", "branch": "dependabot-updates"},
    "dependency-groups": [
      {"name": "go-modules", "rules": {"patterns": ["*"]}}
    ]
  },
  "credentials": [{"type": "git_source", "host": "github.com", "username": "x-access-token", "password": "$LOCAL_GITHUB_ACCESS_TOKEN"}]
}
