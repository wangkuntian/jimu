name: Sync Dependency Updates

# master 前进后，把 master 合入 dependency-updates，让它始终是「master + 累积的依赖升级」。
#
# **为什么走 PR 而不是直推**：dependency-updates 的 ruleset require `PR Gate`（这是 auto-merge
# 安全的前提 —— 没有 required check，`gh pr merge --auto` 会立即合并而不等门禁）。而 GitHub 的
# `required_status_checks` 规则**同样拦截直推**（实测：`git push` → `push declined due to
# repository rule violations`），所以本 workflow 不再直推，改为：推一个临时分支 → 开 PR →
# 让 GitHub 原生 auto-merge 在 `PR Gate` 绿后合并。绝不用 ruleset bypass 绕过（bypass 作用于
# 整条 ruleset，会连 `dependabot-auto-merge.yml` 的 `--auto` 一起放行，等于取消门禁）。
#
# 正常情况下 master 已包含该分支的全部内容，本 workflow 会在「已包含」时直接短路退出；只有当
# 期间该分支又收下新的 dependabot 提交时才发生真实合并，冲突通常只在 go.mod / go.sum。
# 冲突时**故意失败**并给出指引 —— 不做 --force / -X ours 这类会静默丢弃依赖升级的兜底。
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-dependency-updates
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: dependency-updates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependency-updates
          fetch-depth: 0
      - name: "🔀 Open a sync pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 每次运行用独立分支：避免复用已被合并的分支导致 PR 状态错乱
          BRANCH: sync/dependency-updates-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin master "$BASE"
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "✅ $BASE already contains master; nothing to sync."
            exit 0
          fi
          git checkout -b "$BRANCH"
          if ! git merge --no-edit origin/master; then
            git merge --abort || true
            echo "::error::master 合入 $BASE 出现冲突（通常只在 go.mod / go.sum）。请人工执行：git checkout $BASE && git merge origin/master，解决冲突后走 PR 合并。本 workflow 不做自动兜底，以免静默丢弃依赖升级。"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore(deps): sync master into $BASE" \
            --body "Automated sync so dependency pull requests are based on the current master. Native auto-merge merges this once the required \`PR Gate\` check passes; conflicts fail the sync run loudly instead of dropping dependency upgrades."
          # 原生 auto-merge：required check（PR Gate）绿后由 GitHub 合并，不在这里自己判断
          gh pr merge "$BRANCH" --auto --merge
          echo "✅ opened and armed auto-merge for $BRANCH → $BASE"
