name: CI (Commits)

# 提交消息门禁：所有 commit message（summary 与正文）必须为英文
# （AGENTS.md「Commit Message 规范」；本地由 githooks/commit-msg 在 commit 时
# 强制，本 workflow 为服务端兜底，复用同一检查实现）。
#
# 纯文档 PR 仍触发本 workflow，但只运行轻量 Changes job；提交消息门禁对代码/配置/工作流变更生效。

on:
  pull_request:
    branches: [master, release/*]

# 同一 PR 连续更新时取消旧 run（独立于 ci-go / ci-docker）
concurrency:
  group: ci-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Commit Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect non-documentation changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qvE '(^docs/|\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  commit-messages:
    name: Commit Messages (all-English)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR：检查 merge ref 相对 base 分支的全部提交（即 PR 头部的所有提交）。
      # merge ref 不存在（冲突未解决）时降级为只查 PR head 提交。
      - name: "📝 Check pull request commits"
        if: github.event_name == 'pull_request'
        run: |
          if git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/merge"; then
            scripts/check_commit_messages.sh "origin/${{ github.event.pull_request.base.ref }}" "FETCH_HEAD"
          elif git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"; then
            echo "PR merge ref unavailable (conflicts?); falling back to head ref"
            scripts/check_commit_messages.sh "origin/${{ github.event.pull_request.base.ref }}" "FETCH_HEAD"
          else
            echo "cannot fetch PR refs; checking head sha only"
            scripts/check_commit_messages.sh "" "${{ github.event.pull_request.head.sha }}"
          fi
