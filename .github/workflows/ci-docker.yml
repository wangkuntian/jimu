name: CI (Docker)

# 镜像与部署门禁：Docker 镜像构建 / Trivy 安全扫描 / 镜像冒烟 / Compose 配置校验。
# 触发条件（任一匹配）：
#   - Docker/compose/deploy 相关变更（Dockerfile、docker-compose.yml、deploy/、.env.example、scripts、Makefile）
#   - Go 代码变更（镜像包含应用代码，需重建验证；此时与 ci.yml 并行）
# 仅部署/配置文件变更时，不触发 ci.yml 的全量 Go 任务。

on:
  push:
    branches: [master, release/*]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - ".env.example"
      - "scripts/**"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - "internal/capabilities/*/migrations/**"
      - "configs/**"
      - ".github/workflows/ci-docker.yml"
  pull_request:
    branches: [master, release/*]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - ".env.example"
      - "scripts/**"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - "internal/capabilities/*/migrations/**"
      - "configs/**"
      - ".github/workflows/ci-docker.yml"

# 同分支连续推送取消旧 run（独立于 ci-go）
concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "📐 Validate docker-compose.yml"
        run: docker compose config --quiet

      - name: "⬇️ Check secrets files exist"
        run: |
          for f in secrets/db_root_password.txt secrets/db_password.txt \
                   secrets/jwt_secret.txt secrets/otel_auth_password.txt \
                   secrets/zo_auth_token.txt; do
            [ -f "$f" ] || echo "⚠ $f 缺失（运行 make secrets 生成）"
          done

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "🐳 Build Docker image"
        run: docker build -t jimu:${{ github.sha }} .

      - name: "💾 Save image artifact"
        run: docker save jimu:${{ github.sha }} -o jimu-image.tar

      - name: "📤 Upload image artifact"
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: jimu-image.tar
          retention-days: 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v7

      - name: "📥 Download image artifact"
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: .

      - name: "📦 Load Docker image"
        run: docker load -i jimu-image.tar

      - name: "🔐 Trivy image scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: "📋 Generate SBOM"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: cyclonedx
          output: jimu-sbom.json

      - name: "📤 Upload SBOM artifact"
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: jimu-sbom.json

      - name: "📄 Generate license report"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          go run github.com/google/go-licenses@latest report --ignore "jimu/" ./... > license-report.txt
          echo "✅ License report generated"

      - name: "📤 Upload license report"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.txt

  smoke:
    name: Image Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: "📥 Download image artifact"
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: .

      - name: "📦 Load Docker image"
        run: docker load -i jimu-image.tar

      - name: "🚀 Start container and verify health"
        run: |
          docker run -d --name jimu-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 18080:8080 -p 19090:9090 \
            -e APP_ENV=dev \
            -e DB_HOST=host.docker.internal -e DB_PORT=3306 \
            -e DB_USER=root -e DB_PASSWORD=root \
            -e DB_NAME=jimu_test \
            -e REDIS_ADDR=host.docker.internal:6379 \
            -e MANAGEMENT_HOST=0.0.0.0 \
            -e JWT_SECRET=smoke-test-secret \
            jimu:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19090/livez >/dev/null 2>&1; then
              echo "✅ livez OK"
              break
            fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:19090/livez >/dev/null; then
            echo "❌ livez not reachable, container logs:"
            docker logs jimu-smoke
            exit 1
          fi
          curl -sf http://127.0.0.1:19090/livez
          curl -sf http://127.0.0.1:19090/readyz
          echo "✅ Image smoke test passed"
