name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI (Dependabot Focused)]
    types: [completed]

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-auto-merge:
    name: Merge Dependabot Update
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.JIMU_RELEASE_APP_ID }}
          private-key: ${{ secrets.JIMU_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Merge only after focused checks succeed
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$GH_REPO" --state open --base dependabot-updates \
            --json number,author,baseRefName,headRefName,headRefOid)
          pr=$(jq -c --arg head "$RUN_BRANCH" \
            '[.[] | select(.headRefName == $head and .author.login == "dependabot[bot]" and .baseRefName == "dependabot-updates")] | .[0] // empty' <<<"$prs")
          if [[ -z "$pr" ]]; then
            echo "No matching open Dependabot PR for completed workflow run."
            exit 0
          fi

          pr_number=$(jq -r '.number' <<<"$pr")
          head_sha=$(jq -r '.headRefOid' <<<"$pr")
          checks=$(gh pr checks "$pr_number" --repo "$GH_REPO" --json bucket,workflow)
          if ! jq -e '([.[] | select(.workflow == "CI (Dependabot Focused)")] | length) > 0 and
            ([.[] | select(.workflow == "CI (Dependabot Focused)" and .bucket != "pass")] | length) == 0' \
            <<<"$checks" >/dev/null; then
            echo "Focused checks are not all successful; leaving the PR open."
            exit 0
          fi

          current_sha=$(gh pr view "$pr_number" --repo "$GH_REPO" --json headRefOid --jq .headRefOid)
          if [[ "$current_sha" != "$head_sha" ]]; then
            echo "PR head changed while checks were inspected; waiting for its next workflow run."
            exit 0
          fi
          gh pr merge "$pr_number" --repo "$GH_REPO" --squash --delete-branch=false
