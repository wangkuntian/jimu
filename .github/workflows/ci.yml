name: CI (Go)

# Go 代码质量门禁：lint / test（含覆盖率）/ race / benchmark / govulncheck。
# 仅当 Go 相关代码或测试/构建脚本变更时触发。
# 镜像构建与安全扫描见 ci-docker.yml（Dockerfile/compose/deploy 变更）。

on:
  push:
    branches: [master, release/*]
    paths:
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - "internal/capabilities/*/migrations/**"
      - "proto/**"
      - "configs/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, release/*]
    paths:
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - "internal/capabilities/*/migrations/**"
      - "proto/**"
      - "configs/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ci.yml"

# 同分支连续推送取消旧 run（本 workflow 独立取消，不干扰 ci-docker）
concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CHANGELOG 门禁用 git diff origin/<base_ref>...HEAD 判定，需要基线分支历史
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🔍 gofmt check"
        run: |
          if gofmt -l . | grep -q .; then
            echo "❌ The following files need formatting:"
            gofmt -l .
            exit 1
          fi
          echo "✅ All files properly formatted"

      - name: "🔬 go vet"
        run: |
          go vet ./...
          echo "✅ go vet passed"

      - name: "🧾 Structured log usage check"
        run: make check-log-usage

      - name: "🧹 golangci-lint"
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          install-mode: goinstall

      - name: "📝 CHANGELOG check"
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(internal/|cmd/|configs/)' \
            | grep -qv '^$'; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -Eq '^CHANGELOG\.md$|^docs/releases/'; then
              echo "❌ PR changes source files but CHANGELOG is not updated"
              echo "👉 Please update docs/releases/<target version>.md"
              exit 1
            fi
          fi
          echo "✅ CHANGELOG check passed"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jimu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "📦 Install coverage tools"
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: "🧪 Run tests with coverage"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        run: go test ./... -coverprofile=coverage.out

      - name: "🗄️  Verify backup/restore round trip (mysql + postgres)"
        run: |
          # 客户端版本须 >= 服务端：CI 的 postgres service 是 17，Ubuntu 自带客户端为 16，
          # 因此统一走共享安装脚本（与备份镜像同一份逻辑）
          sudo PG_CLIENT_VERSION=17 bash scripts/install_db_clients.sh
          # 直接调用 scripts/backup.sh 与 scripts/restore.sh（host 模式），
          # 覆盖客户端探测、方言分支与恢复校验，而不是内联重写一套 dump 逻辑
          MODE=host DB_DRIVER=mysql \
            DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASSWORD=root DB_NAME=jimu_test \
            ./scripts/test_backup_restore.sh
          MODE=host DB_DRIVER=postgres \
            DB_HOST=127.0.0.1 DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres DB_NAME=jimu_test \
            ./scripts/test_backup_restore.sh

      - name: "🐘 Run postgres migration smoke"
        env:
          DB_DRIVER: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: jimu_test
        run: go test ./internal/kernel/db/... -run TestMigrationIntegration -v

      - name: "📊 Check coverage threshold"
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          THRESHOLD=70
          echo "📈 Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            go tool cover -func=coverage.out
            exit 1
          fi
          echo "✅ Coverage check passed (${COVERAGE}% >= ${THRESHOLD}%)"

      - name: "📋 Check OpenAPI is current"
        run: |
          make swagger
          git diff --exit-code docs/openapi

      - name: "📜 Check smoke scripts"
        run: |
          bash -n scripts/test_runtime_security.sh
          bash -n scripts/smoke_api_contract.sh
          bash -n scripts/test_backup_restore.sh

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jimu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🏎️ Run race tests"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        run: go test -race ./...

  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "📈 Install benchstat"
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: "⏱️ Run benchmark"
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/bench_ci.sh --absolute

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🛡️ govulncheck"
        # 统一走 make（豁免清单与本地一致，见 scripts/govulncheck.sh）
        run: make govulncheck
