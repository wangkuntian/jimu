name: CI

on:
  push:
    branches: [master, release/*]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, release/*]

env:
  GO_VERSION: "1.26.6"
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🔍 gofmt check"
        run: |
          if gofmt -l . | grep -q .; then
            echo "❌ The following files need formatting:"
            gofmt -l .
            exit 1
          fi
          echo "✅ All files properly formatted"

      - name: "🔬 go vet"
        run: |
          go vet ./...
          echo "✅ go vet passed"

      - name: "🧹 golangci-lint"
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          install-mode: goinstall

      - name: "📝 CHANGELOG check"
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(internal/|cmd/|configs/|migrations/)' \
            | grep -qv '^$'; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -q '^CHANGELOG\.md$'; then
              echo "❌ PR changes source files but CHANGELOG.md is not updated"
              echo "👉 Please update the [Unreleased] section in CHANGELOG.md"
              exit 1
            fi
          fi
          echo "✅ CHANGELOG check passed"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jimu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "📦 Install coverage tools"
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: "🧪 Run tests with coverage"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        run: go test ./... -coverprofile=coverage.out

      - name: "🐘 Run postgres migration smoke"
        env:
          DB_DRIVER: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: jimu_test
        run: go test ./internal/platform/db/... -run TestPostgresMigrationUpDown -v

      - name: "📊 Check coverage threshold"
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          THRESHOLD=70
          echo "📈 Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            go tool cover -func=coverage.out
            exit 1
          fi
          echo "✅ Coverage check passed (${COVERAGE}% >= ${THRESHOLD}%)"

      - name: "🏎️ Run race tests"
        run: go test -race ./...

      - name: "📋 Check OpenAPI is current"
        run: |
          make swagger
          git diff --exit-code docs/openapi

      - name: "📜 Check smoke scripts"
        run: |
          bash -n scripts/test_runtime_security.sh
          bash -n scripts/smoke_api_contract.sh
          bash -n scripts/test_backup_restore.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, bench]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🔨 Build server"
        run: go build -o bin/server cmd/server/main.go

      - name: "🔧 Build CLI"
        run: go build -o bin/jimu cmd/cli/main.go

      - name: "📤 Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/

  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "📈 Install benchstat"
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: "⏱️ Run benchmark"
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/bench_ci.sh --absolute


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: "🐳 Build Docker image"
        run: docker build -t jimu:${{ github.sha }} .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🛡️ govulncheck"
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: "🐳 Build Docker image for scanning"
        run: docker build -t jimu:${{ github.sha }} .

      - name: "🔐 Trivy image scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: "📋 Generate SBOM"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: cyclonedx
          output: jimu-sbom.json

      - name: "📤 Upload SBOM artifact"
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: jimu-sbom.json

      - name: "📄 Generate license report"
        run: |
          go run github.com/google/go-licenses@latest report ./... > license-report.txt
          echo "✅ License report generated"
        continue-on-error: true

      - name: "📤 Upload license report"
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.txt
        continue-on-error: true

  smoke:
    name: Image Smoke Test
    runs-on: ubuntu-latest
    needs: [security]
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: "🐳 Build Docker image"
        run: docker build -t jimu:${{ github.sha }} .

      - name: "🚀 Start container and verify health"
        run: |
          docker run -d --name jimu-smoke \
            -p 18080:8080 -p 19090:9090 \
            -e APP_ENV=dev \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_USER=root -e DB_PASSWORD=root \
            -e DB_NAME=jimu_test \
            -e REDIS_ADDR=127.0.0.1:6379 \
            -e JWT_SECRET=smoke-test-secret \
            jimu:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19090/livez >/dev/null 2>&1; then
              echo "✅ livez OK"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:19090/livez
          curl -sf http://127.0.0.1:19090/readyz
          echo "✅ Image smoke test passed"