name: CI (Go)

# Go 代码质量门禁：lint / test（含覆盖率）/ race / benchmark / govulncheck。
# 仅当 Go 相关代码或测试/构建脚本变更时触发。
# 镜像构建与安全扫描见 ci-docker.yml（Dockerfile/compose/deploy 变更）。

on:
  # 手动触发：重型 Scaffold Matrix job 的入口之一（触发口径见该 job 的 if:）
  workflow_dispatch:
  push:
    branches: [master, release/*]
    paths:
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - "internal/capabilities/*/migrations/**"
      - "proto/**"
      - "configs/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, release/*]
    paths:
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - "internal/capabilities/*/migrations/**"
      - "proto/**"
      - "configs/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ci.yml"

# 同分支连续推送取消旧 run（本 workflow 独立取消，不干扰 ci-docker）
concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CHANGELOG 门禁用 git diff origin/<base_ref>...HEAD 判定，需要基线分支历史
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🔍 gofmt check"
        run: |
          if gofmt -l . | grep -q .; then
            echo "❌ The following files need formatting:"
            gofmt -l .
            exit 1
          fi
          echo "✅ All files properly formatted"

      - name: "🔬 go vet"
        run: |
          go vet ./...
          echo "✅ go vet passed"

      - name: "🧾 Structured log usage check"
        run: make check-log-usage

      - name: "🧹 golangci-lint"
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          install-mode: goinstall

      - name: "📝 CHANGELOG check"
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(internal/|cmd/|configs/)' \
            | grep -qv '^$'; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -Eq '^CHANGELOG\.md$|^docs/releases/'; then
              echo "❌ PR changes source files but CHANGELOG is not updated"
              echo "👉 Please update docs/releases/<target version>.md"
              exit 1
            fi
          fi
          echo "✅ CHANGELOG check passed"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jimu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "📦 Install coverage tools"
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: "🧪 Run tests with coverage"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        # 重型脚手架矩阵（真实生成项目 + build/vet/test/run）已由 JIMU_HEAVY_MATRIX 门控并搬到
        # 独立的 Scaffold Matrix job，本 job 只跑轻量断言
        run: go test ./... -coverprofile=coverage.out -timeout 15m

      - name: "🗄️  Verify backup/restore round trip (mysql + postgres)"
        run: |
          # 客户端版本须 >= 服务端：CI 的 postgres service 是 17，Ubuntu 自带客户端为 16，
          # 因此统一走共享安装脚本（与备份镜像同一份逻辑）
          sudo PG_CLIENT_VERSION=17 bash scripts/install_db_clients.sh
          # 直接调用 scripts/backup.sh 与 scripts/restore.sh（host 模式），
          # 覆盖客户端探测、方言分支与恢复校验，而不是内联重写一套 dump 逻辑
          MODE=host DB_DRIVER=mysql \
            DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASSWORD=root DB_NAME=jimu_test \
            ./scripts/test_backup_restore.sh
          MODE=host DB_DRIVER=postgres \
            DB_HOST=127.0.0.1 DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres DB_NAME=jimu_test \
            ./scripts/test_backup_restore.sh

      - name: "🐘 Run postgres migration smoke"
        env:
          DB_DRIVER: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: jimu_test
        run: go test ./internal/kernel/db/... -run TestMigrationIntegration -v

      - name: "📊 Check coverage threshold"
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          THRESHOLD=70
          echo "📈 Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            go tool cover -func=coverage.out
            exit 1
          fi
          echo "✅ Coverage check passed (${COVERAGE}% >= ${THRESHOLD}%)"

      - name: "📋 Check OpenAPI is current"
        run: |
          make swagger
          git diff --exit-code docs/openapi

      - name: "📜 Check smoke scripts"
        run: |
          bash -n scripts/test_runtime_security.sh
          bash -n scripts/smoke_api_contract.sh
          bash -n scripts/test_backup_restore.sh

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jimu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🏎️ Run race tests"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        # 同 Test：重型脚手架矩阵已门控出默认路径（见 Scaffold Matrix job）
        run: go test -race ./... -timeout 15m

  scaffold-matrix:
    name: Scaffold Matrix
    # **为何默认不在 PR 上跑**：2 vCPU runner 上冷跑约 28 分钟（CPU 时间 ≈3330s），
    # 若每个 PR 都跑，作者要等 30–40 分钟（用户裁定 B1 / 计划裁定 19）。
    # 本 job 只在下列情形运行（任一满足）：
    #   ① 手动 workflow_dispatch；
    #   ② push 到 release/**（发布前全量验证）；
    #   ③ push tag（refs/tags/**；注意 ci.yml 的 push 触发只列了 branches、没有 tags，
    #      所以这一条目前是防御性的 —— tag 发布的重型矩阵由 release.yml 的 quality job 承担，
    #      两者共用同一份 actions/cache）；
    #   ④ PR 打上 heavy-ci 标签（需要时手动加标签跑满矩阵）。
    # 轻量 job（Lint/Test/Race/Bench/Govulncheck）的触发不受影响，仍每个 PR 都跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.pull_request.labels.*.name, 'heavy-ci')
    # 与 Test/Race 并行：只跑被 JIMU_HEAVY_MATRIX 门控的重型矩阵（真实生成项目 + build/vet/test/run），
    # 不产出覆盖率、不参与覆盖率阈值。GOCACHE 经 actions/cache 跨运行复用；生成项目的构建一律带
    # -trimpath（见 tools/generator 的 trimpathGoflags），构建条目与临时路径无关。
    # 缓存的收益是**有限且不收敛**的：每轮约 +13.5 MB / +3290 文件（相比无 -trimpath 的每轮
    # +300 MB 约降 20× 增长），体积实际由 Go 自身的「5 天未使用」裁剪兜底（cmd/go/internal/cache
    # 的 trimInterval=24h / trimLimit=5d，无大小上限），热跑约快 8%（非收敛）。
    # 首次冷跑（缓存条目还不存在）在 2 核 runner 上约 28 分钟，故 -timeout 60m 覆盖首跑；
    # job 超时给 90 分钟上限，避免异常挂起占满默认 360 分钟。
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🗂️ Restore the scaffold GOCACHE"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scaffold-gocache
          # key 里的 `-v1` 是**可递增的版本后缀**：体积超阈值（见下方守卫步骤）、或怀疑缓存内容
          # 损坏/被污染时，把它递增（-v2、-v3…）后重跑即可强制重建 —— 新 key 必然未命中，
          # 旧条目由仓库 actions/cache 配额（10 GB）LRU 淘汰。release.yml 用同一规范，
          # 因此两个 workflow 命中同一份缓存；`hashFiles('go.sum')` 后缀区分依赖变化。
          key: scaffold-gocache-v1-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            scaffold-gocache-v1-${{ runner.os }}-

      - name: "🏗️ Run the heavy scaffold matrix"
        env:
          JIMU_HEAVY_MATRIX: "1"
          JIMU_TEST_GOCACHE: ${{ runner.temp }}/scaffold-gocache
        # -v 便于失败时定位是哪个选区/形态
        run: go test ./tools/generator/ -count=1 -timeout 60m -v

      - name: "📏 Report the scaffold GOCACHE size"
        if: always()
        run: |
          CACHE="${{ runner.temp }}/scaffold-gocache"
          du -sh "$CACHE" 2>/dev/null || echo "（缓存目录不存在）"
          SIZE_MB=$(du -sm "$CACHE" 2>/dev/null | cut -f1 || true)
          # actions/cache 的语义：主 key 命中时**只恢复不重存**（key 不可变），本次运行新增的条目
          # 随 runner 丢弃；主 key 未命中（go.sum 变了或刚 bump 版本后缀）时靠 restore-keys 拿旧缓存、
          # 跑完把合并后的目录存成新条目。
          # 非破坏性守卫：**绝不**在 job 内清空缓存 —— 清空后 actions/cache 的 save 步骤会把**空归档**
          # 写进同一个（不可变的）key，之后永久命中空缓存、永远冷启动。超阈值只报错退出并给出 bump
          # 指引；缓存内容的删除交给「bump 版本后缀 + 仓库 10 GB 配额 LRU 淘汰」。
          if [ -n "${SIZE_MB:-}" ] && [ "$SIZE_MB" -gt 6144 ]; then
            echo "::error::scaffold GOCACHE ${SIZE_MB} MB 超过 6 GiB（仓库 actions/cache 配额 10 GB）：请把 .github/workflows/ci.yml 里 cache key 的 -v1 后缀递增（-v2、-v3…，release.yml 同步）后重跑；不要在本 job 内删除缓存内容"
            exit 1
          fi

  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "📈 Install benchstat"
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: "⏱️ Run benchmark"
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/bench_ci.sh --absolute

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🛡️ govulncheck"
        # 统一走 make（豁免清单与本地一致，见 scripts/govulncheck.sh）
        run: make govulncheck
