name: CI

on:
  push:
    branches: [master, release/*]
  pull_request:
    branches: [master, release/*]

env:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt check
        run: |
          if gofmt -l . | grep -q .; then
            echo "以下文件需要格式化:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./internal/app ./internal/config ./internal/platform/auth ./internal/platform/http/... ./internal/modules/auth/... ./internal/modules/audit/...

      - name: Check OpenAPI is current
        run: |
          make swagger
          git diff --exit-code docs/openapi

      - name: Check smoke scripts
        run: |
          bash -n work/test_runtime_security.sh
          bash -n work/smoke_api_contract.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server
        run: go build -o bin/server cmd/server/main.go

      - name: Build CLI
        run: go build -o bin/jimu cmd/cli/main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jimu:${{ github.sha }} .
