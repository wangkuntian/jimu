name: CI

on:
  push:
    branches: [master, release/*]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, release/*]

env:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt check
        run: |
          if gofmt -l . | grep -q .; then
            echo "以下文件需要格式化:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install coverage tools
        run: apt-get update && apt-get install -y bc

      - name: Run tests with coverage
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        run: go test ./... -coverprofile=coverage.out

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          THRESHOLD=70
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            go tool cover -func=coverage.out
            exit 1
          fi
          echo "Coverage check passed (${COVERAGE}% >= ${THRESHOLD}%)"

      - name: Run race tests
        run: go test -race ./...

      - name: Check OpenAPI is current
        run: |
          make swagger
          git diff --exit-code docs/openapi

      - name: Check smoke scripts
        run: |
          bash -n scripts/test_runtime_security.sh
          bash -n scripts/smoke_api_contract.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, bench]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server
        run: go build -o bin/server cmd/server/main.go

      - name: Build CLI
        run: go build -o bin/jimu cmd/cli/main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmark (absolute thresholds, machine-independent)
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/bench_ci.sh --absolute


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jimu:${{ github.sha }} .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck (依赖漏洞扫描)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build Docker image for scanning
        run: docker build -t jimu:${{ github.sha }} .

      - name: Trivy 镜像漏洞扫描
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: SBOM 生成
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: cyclonedx
          output: jimu-sbom.json

      - name: 上传 SBOM 产物
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: jimu-sbom.json

      - name: 生成依赖许可证报告
        run: |
          go run github.com/google/go-licenses@latest report ./... > license-report.txt
          echo "许可证报告生成完成"
        continue-on-error: true

      - name: 上传许可证报告
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.txt
        continue-on-error: true

  smoke:
    name: Image Smoke Test
    runs-on: ubuntu-latest
    needs: [security]
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jimu:${{ github.sha }} .

      - name: 启动容器并验证健康检查
        run: |
          docker run -d --name jimu-smoke \
            -p 18080:8080 -p 19090:9090 \
            -e APP_ENV=dev \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_USER=root -e DB_PASSWORD=root \
            -e DB_NAME=jimu_test \
            -e REDIS_ADDR=127.0.0.1:6379 \
            -e JWT_SECRET=smoke-test-secret \
            jimu:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19090/livez >/dev/null 2>&1; then
              echo "livez OK"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:19090/livez
          curl -sf http://127.0.0.1:19090/readyz
          echo "镜像 smoke test 通过"
