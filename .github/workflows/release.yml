name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.6"
  GOLANGCI_LINT_VERSION: "v2.7.2"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jimu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          install-mode: goinstall

      # 与 ci.yml 的 Scaffold Matrix job **同源**的构建缓存：同 path、同 key 规范（含可递增的
      # `-v1` 版本后缀）、同 restore-keys 前缀 → 只要 CI 上跑过重型矩阵，tag 发布的 quality job
      # 就能命中同一份仓库缓存，不再每次冷跑。bump 规则：ci.yml 把 `-v1` 递增时，这里同步递增。
      # 注意：**首次发布仍是冷跑**（仓库里还没有该 key 的条目 → 无可恢复），2 核 runner 上约 28 分钟；
      # 故下一步骤显式 timeout-minutes: 120（go test 自身另有 -timeout 60m）。
      - name: "🗂️ Restore the scaffold GOCACHE (shared with ci.yml)"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scaffold-gocache
          key: scaffold-gocache-v1-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            scaffold-gocache-v1-${{ runner.os }}-

      # make release-check 内含 test-scaffold-matrix（JIMU_HEAVY_MATRIX=1 的重型脚手架矩阵）：
      # tag 发布路径必须真跑那 8 条「真实生成项目 + build/vet/test/run」用例，不能静默跳过。
      # JIMU_TEST_GOCACHE 指向上一步恢复的缓存目录，命中时才是热跑。
      - name: Run release checks (incl. heavy scaffold matrix) and Compose smoke
        timeout-minutes: 120
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
          JIMU_TEST_GOCACHE: ${{ runner.temp }}/scaffold-gocache
        run: make release-check

      - name: Run PostgreSQL migration smoke
        env:
          DB_DRIVER: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: jimu_test
        run: go test ./internal/kernel/db/... -run TestPostgresMigrationUpDown -v

      - name: Check coverage, race safety, OpenAPI, scripts, and binaries
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        run: make test-cover test-coverage-check test-race swagger-check smoke-check build

      - name: Run performance gate
        run: scripts/bench_ci.sh --absolute

  container-security:
    name: Container Security Gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build release image
        run: docker build -t jimu:${{ github.sha }} .

      - name: Scan release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jimu:${{ github.sha }}
          format: cyclonedx
          output: jimu-sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: jimu-sbom.json

      - name: Run isolated Compose smoke
        run: ./scripts/test_runtime_security.sh

      - name: Run isolated API contract smoke
        run: ./scripts/smoke_api_contract.sh

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [quality, container-security]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build release binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/jimu-linux-amd64 cmd/server/main.go
          GOOS=linux GOARCH=arm64 go build -o bin/jimu-linux-arm64 cmd/server/main.go
          GOOS=darwin GOARCH=amd64 go build -o bin/jimu-darwin-amd64 cmd/server/main.go
          GOOS=darwin GOARCH=arm64 go build -o bin/jimu-darwin-arm64 cmd/server/main.go

      - name: Read release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            cat "$NOTES_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "::warning::Release notes file not found: $NOTES_FILE, falling back to auto-generated changelog"
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "See CHANGELOG.md for details." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: bin/jimu-*
          draft: false
          prerelease: false
