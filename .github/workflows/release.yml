name: Release (Publish)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.9"

# tag 只负责发布由 GitHub App 创建并合并的 release/* → master 候选 PR。
# master ruleset 承担候选 PR 的常规门禁与 Scaffold Matrix；本 workflow 再校验候选 PR、Issue、tag 和 master tip 一致，
# 避免直接给当前 master 打 tag 绕过受管发布入口。
jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.JIMU_RELEASE_APP_ID }}
          private-key: ${{ secrets.JIMU_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-issues: read

      - name: Verify tag points to current master tip
        env:
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if [[ "$TAG_ACTOR" != "${APP_SLUG}[bot]" ]]; then
            echo "::error::Tag does not point to a managed release candidate: tag push must come from the configured GitHub App"
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag does not point to a managed release candidate: invalid version tag $GITHUB_REF_NAME"
            exit 1
          fi

          version=${GITHUB_REF_NAME#v}
          release_branch="release/$GITHUB_REF_NAME"
          app_bot="${APP_SLUG}[bot]"
          pull_requests=$(gh api "repos/$GH_REPO/pulls" --method GET \
            --field state=closed --field base=master --field "head=$GH_OWNER:$release_branch" --paginate)
          candidate_pr=$(jq -c --arg release_branch "$release_branch" --arg app_bot "$app_bot" --arg version "$GITHUB_REF_NAME" '
            [.[] | . as $pr | select($pr.head.ref == $release_branch and $pr.base.ref == "master" and $pr.merged_at != null
              and $pr.user.login == $app_bot
              and (($pr.body // "") | contains("<!-- jimu-release-automation:" + $version + " final -->")))]
            | sort_by(.merged_at) | last // empty' <<<"$pull_requests")
          if [[ -z "$candidate_pr" ]]; then
            echo "::error::Tag does not point to a managed release candidate: no App-created candidate PR"
            exit 1
          fi

          issues=$(gh api "repos/$GH_REPO/issues" --method GET --field state=all --field per_page=100 --paginate)
          issue=$(jq -c --arg title "release: $GITHUB_REF_NAME" '
            [.[] | select(.pull_request == null and .title == $title
              and (([.labels[]?.name] | index("release: candidate")) != null
                or ([.labels[]?.name] | index("release: blocked")) != null))] | .[0] // empty' <<<"$issues")
          if [[ -z "$issue" ]]; then
            echo "::error::Tag does not point to a managed release candidate: matching Issue is not in candidate or retryable blocked state"
            exit 1
          fi
          issue_number=$(jq -r '.number' <<<"$issue")
          comments=$(gh api "repos/$GH_REPO/issues/$issue_number/comments" --method GET --paginate)
          if ! grep -Fq "<!-- jimu-release-automation:$GITHUB_REF_NAME -->" <<<"$comments"; then
            echo "::error::Tag does not point to a managed release candidate: Release Issue marker is missing"
            exit 1
          fi

          tag_sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          master_sha=$(git rev-parse "origin/master^{commit}")
          candidate_sha=$(jq -r '.merge_commit_sha // empty' <<<"$candidate_pr")
          if [[ "$tag_sha" != "$master_sha" || "$tag_sha" != "$candidate_sha" ]]; then
            echo "::error::Tag does not point to a managed release candidate: tag=$tag_sha candidate=$candidate_sha master=$master_sha"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} matches managed candidate PR and current master at ${master_sha}."

      - name: Build release binaries
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -o bin/jimu-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o bin/jimu-linux-arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -o bin/jimu-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -o bin/jimu-darwin-arm64 ./cmd/server

      - name: Read release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo "body<<EOF"
              cat "$NOTES_FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release notes file not found: $NOTES_FILE, falling back to auto-generated changelog"
            {
              echo "body<<EOF"
              echo "See CHANGELOG.md for details."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          name: ${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: bin/jimu-*
          draft: false
          prerelease: false
