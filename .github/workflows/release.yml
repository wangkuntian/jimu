name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.6"

# tag 只负责发布已经验证过的 master tip。
# 发布候选的常规门禁与重型 Scaffold Matrix 由 release/* → master PR 的 required checks 承担；
# 这里拒绝不是当前 master tip 的 tag，避免绕过候选 PR 直接发布旧提交或分支提交。
jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify tag points to current master tip
        run: |
          git fetch --no-tags origin master
          tag_sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          master_sha=$(git rev-parse "origin/master^{commit}")
          if [ "$tag_sha" != "$master_sha" ]; then
            echo "Tag ${GITHUB_REF_NAME} points to ${tag_sha}, but origin/master is ${master_sha}."
            echo "Create the release tag only after the release candidate PR has merged."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} matches origin/master at ${master_sha}."

      - name: Build release binaries
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -o bin/jimu-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o bin/jimu-linux-arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -o bin/jimu-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -o bin/jimu-darwin-arm64 ./cmd/server

      - name: Read release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo "body<<EOF"
              cat "$NOTES_FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release notes file not found: $NOTES_FILE, falling back to auto-generated changelog"
            {
              echo "body<<EOF"
              echo "See CHANGELOG.md for details."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: bin/jimu-*
          draft: false
          prerelease: false
