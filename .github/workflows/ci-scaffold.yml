name: CI (Scaffold Matrix)

# 重型脚手架矩阵：真实生成项目 + `go build/vet/test/run`（由 JIMU_HEAVY_MATRIX=1 门控，
# 本地等价命令 `make test-scaffold-matrix`）。**普通开发 PR 不跑** —— 冷跑要十几到几十分钟，
# 只在发布候选 PR 上运行，避免每个开发 PR 都等待重型矩阵。
#
# 触发口径（任一满足）：
#   ① 手动 workflow_dispatch：只跑这条重型 workflow（这是它独立成文件的主要理由之一 —— 挂在 ci.yml 上
#      时手动触发会把 Lint/Test/Race/Bench/Govulncheck 一起拉起来）；
#   ② release/* → master 的 PR：发布候选全量验证；
#   ③ 每周一次的夜间定时：模板/闭包漂移在两次 release 之间就能抓到。
# tag 发布不再重复执行矩阵；release→master PR 的必需检查负责验证要发布的 master tip。
#
# 为什么独立成 workflow（而不是 ci.yml 里的一个 job）：
#   1. 手动触发只跑矩阵，不附带整套 PR 门禁；
#   2. 自己的并发组：ci.yml 的 `ci-go-<ref>` 开着 cancel-in-progress，同分支任何一次推送都会取消
#      正在跑的矩阵 —— 被取消的 run **不会执行缓存 save 步骤**，滚动缓存等于白配；
#   3. 能加夜间 schedule 而不会连带把轻量 job 也定时跑一遍。
#
# 拆分前运行时间（实测，run 36383945753 的 Scaffold Matrix job）：job 14m46s，其中 test 步骤 861s，
# 构成是 25 个选区构建网 ≈560s（占 65%）、5+5 个生成项目测试树 239s、其余门控用例 ~150s、
# 编译/缓存恢复 ~100s。已做的优化：`heavyBuildConcurrency` 从 2 提到 4（标准 runner 是
# 4 vCPU，定死在 2 只用一半 CPU；旧注释里的「2 vCPU」是从 `CPU 时间 3330s / 墙钟 28min ≈ 2`
# 反推出来的，那个 2 其实是当时的并发上限）+ 下面这份滚动缓存。现在拆成 4 个构建、
# 2 个生成项目测试、1 个其余用例并行作业；原 Scaffold Matrix 名称由聚合 job 保留。

on:
  workflow_dispatch:
  pull_request:
    # 只监听 release/* → master 的发布候选 PR；普通 feature/fix → release PR 不跑重型矩阵。
    types: [opened, synchronize, reopened]
    branches: [master]
  schedule:
    # 每周一 03:00 UTC（北京 11:00）：在默认分支最新提交上跑一次，抓模板/闭包漂移
    - cron: "0 3 * * 1"

# 与 ci.yml 的 `ci-go-<ref>` 分开：本 workflow 的 run 只被同一条重型流水线的新 run 取代，
# 不会被无关的轻量推送取消（取消会丢掉滚动缓存的 save）
concurrency:
  group: ci-scaffold-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.9"

jobs:
  changes:
    name: Scaffold Changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect scaffold inputs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(cmd/|internal/|tools/|go\.mod$|go\.sum$|internal/capabilities/.*/migrations/|proto/|configs/|scripts/|Makefile$|docs/openapi/|\.github/workflows/ci-scaffold\.yml$)'; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          fi

  scaffold-shards:
    name: Scaffold (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: capability-build-1, spec: '1/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: capability-build-2, spec: '2/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: capability-build-3, spec: '3/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: capability-build-4, spec: '4/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: generated-tests-1, spec: '1/2', test: TestGeneratedProjectTestTreeIsGreen }
          - { name: generated-tests-2, spec: '2/2', test: TestGeneratedProjectTestTreeIsGreen }
          - { name: invariants, spec: '', test: '' }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🗂️ Restore the scaffold GOCACHE"
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/scaffold-gocache
          # 滚动 key（发布候选 PR 与手动/定时运行共用同一规范）：
          #   `-v1` 是**可递增的版本后缀** —— 体积超阈值（见下方守卫）或怀疑缓存内容损坏/被污染时，
          #   递增（-v2、-v3…）后重跑即可强制重建；新 key 必然未命中，旧条目由仓库 actions/cache
          #   配额（10 GB）LRU 淘汰。
          #   末尾的 `${{ github.sha }}` 是关键：Actions 的缓存条目按 key **不可变**，命中即
          #   「只恢复不重存」。旧 key 只含 `hashFiles('go.sum')`，于是快照在首次保存那一刻就冻结，
          #   之后每个 commit 的 first-party 编译产物全部随 runner 丢弃 —— 每次都只有依赖是热的。
          #   带上 sha 后主 key 只在重跑同一 commit 时命中；正常路径是未命中 → 靠 restore-keys 拿
          #   最近一份快照 → 跑完把合并后的目录存成**新**条目，收益才能跨 commit 累积。
          key: scaffold-gocache-v1-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            scaffold-gocache-v1-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            scaffold-gocache-v1-${{ runner.os }}-

      - name: "🏗️ Run scaffold shard"
        env:
          JIMU_HEAVY_MATRIX: "1"
          JIMU_TEST_GOCACHE: ${{ runner.temp }}/scaffold-gocache
          JIMU_SCAFFOLD_SHARD: ${{ matrix.spec }}
          MATRIX_TEST: ${{ matrix.test }}
        run: |
          if [ -n "$MATRIX_TEST" ]; then
            go test ./tools/generator/ -count=1 -timeout 60m -v -run "^$MATRIX_TEST$"
          else
            go test ./tools/generator/ -count=1 -timeout 60m -v -skip '^(TestGeneratedProjectBuildsAndVetsForEverySelection|TestGeneratedProjectTestTreeIsGreen)$'
          fi

      - name: "📏 Report the scaffold GOCACHE size"
        if: always()
        run: |
          CACHE="${{ runner.temp }}/scaffold-gocache"
          du -sh "$CACHE" 2>/dev/null || echo "（缓存目录不存在）"
          SIZE_MB=$(du -sm "$CACHE" 2>/dev/null | cut -f1 || true)
          # 非破坏性守卫：**绝不**在 job 内清空缓存 —— 清空后 actions/cache 的 save 步骤会把**空归档**
          # 写进同一个 key，之后永久命中空缓存、永远冷启动。超阈值只报错退出并给出 bump 指引；
          # 缓存内容的删除交给「bump 版本后缀 + 仓库 10 GB 配额 LRU 淘汰」。
          # 阈值：滚动 key 会真的把每轮的增量存下来，所以这里的体积是**稳态体积**（不再是「只涨在
          # job 内、跑完全丢」的假象），但仍受 Go 自身的 5 天未使用裁剪兜底（cmd/go/internal/cache
          # 的 trimInterval=24h / trimLimit=5d，无大小上限）。
          if [ -n "${SIZE_MB:-}" ] && [ "$SIZE_MB" -gt 6144 ]; then
            echo "::error::scaffold GOCACHE ${SIZE_MB} MB 超过 6 GiB（仓库 actions/cache 配额 10 GB）：请把 ci-scaffold.yml 里 cache key 的 -v1 后缀递增（-v2、-v3…，release.yml 同步）后重跑；不要在本 job 内删除缓存内容"
            exit 1
          fi

      # 七个作业均从同一滚动快照恢复；只由一个作业保存，避免写入竞态和缓存配额放大。
      - name: "💾 Save the scaffold GOCACHE"
        if: matrix.name == 'generated-tests-1' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/scaffold-gocache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  scaffold-matrix:
    name: Scaffold Matrix
    needs: [changes, scaffold-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate release gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          SHARDS_RESULT: ${{ needs.scaffold-shards.result }}
          RELEASE_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_BASE: ${{ github.event.pull_request.base.ref }}
          RELEASE_SOURCE: ${{ github.head_ref }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Scaffold input detection failed: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && \
            [ "$RELEASE_BASE" = master ] && \
            [ "$RELEASE_AUTHOR" = "dependabot[bot]" ] && \
            [[ "$RELEASE_SOURCE" != release/* ]]; then
            echo "Scaffold Matrix skipped for Dependabot security update targeting master."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [[ "$RELEASE_SOURCE" != release/* ]]; then
            echo "::error::Scaffold Matrix only accepts release/* -> master PRs: $RELEASE_SOURCE"
            exit 1
          fi
          if [ "$HEAVY" = true ] && [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Scaffold shards failed or were skipped: $SHARDS_RESULT"
            exit 1
          fi
          if [ "$HEAVY" = false ] && [ "$SHARDS_RESULT" != skipped ]; then
            echo "::error::Scaffold shards unexpectedly ran: $SHARDS_RESULT"
            exit 1
          fi
