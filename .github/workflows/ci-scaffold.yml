name: CI (Scaffold)

# 两层脚手架门禁：
#   official：只跑需要 Docker 的 auth 空库 E2E；release/* 与 dependabot/* → master PR 运行，
#             本地等价命令 `make test-scaffold-official`。预设预算与 minimal 无依赖 smoke
#             不需要 Docker，已在 ci.yml 的 race 分片里每个 PR 都跑 —— 放在这里只会重复一遍。
#   full：全能力/全 profile 生成器矩阵；只在 schedule 与 workflow_dispatch 运行，
#         本地等价命令 `make test-scaffold-matrix`。
# **普通开发 PR 不跑** —— feature/fix → release 不触发本 workflow。
#
# 触发口径：
#   ① release/* 与 dependabot/* → master PR：official；
#   ② workflow_dispatch：full（用于发布前或改动生成器/能力后的人工完整验证）；
#   ③ 每周一次的夜间定时：full。
# ① 之外的其它来源 PR 由下面的 `Scaffold Gate` 聚合 job fail-closed 拒绝。
# tag 发布不再重复执行矩阵；release→master PR 的必需检查验证 official，full 需要时在合并前手动
# workflow_dispatch 验证同一 ref。
#
# 为什么独立成 workflow（而不是 ci.yml 里的一个 job）：
#   1. 手动触发只跑矩阵，不附带整套 PR 门禁；
#   2. 自己的并发组：ci.yml 的 `ci-go-<ref>` 开着 cancel-in-progress，同分支任何一次推送都会取消
#      正在跑的矩阵 —— 被取消的 run **不会执行缓存 save 步骤**，滚动缓存等于白配；
#   3. 能加夜间 schedule 而不会连带把轻量 job 也定时跑一遍。
#
# 拆分前运行时间（实测，run 36383945753 的 Scaffold Gate job）：job 14m46s，其中 test 步骤 861s，
# 构成是 25 个选区构建网 ≈560s（占 65%）、5+5 个生成项目测试树 239s、其余门控用例 ~150s、
# 编译/缓存恢复 ~100s。已做的优化：`heavyBuildConcurrency` 从 2 提到 4（标准 runner 是
# 4 vCPU，定死在 2 只用一半 CPU；旧注释里的「2 vCPU」是从 `CPU 时间 3330s / 墙钟 28min ≈ 2`
# 反推出来的，那个 2 其实是当时的并发上限）+ 下面这份滚动缓存。full 档仍拆成 4 个构建、
# 2 个生成项目测试、2 个固定组合矩阵、1 个 upgrade fixtures、1 个其余用例并行作业；
# official 是单个 job。聚合 job 以 Scaffold Gate 这一名称对外保留单一必需检查。
# 组合矩阵本地实测 121s（10 个生成项目、2 路并发）；CI 每个 shard 的实际耗时写入 step summary。

on:
  workflow_dispatch:
  pull_request:
    # 监听面向 master 的 PR：release/*（发布候选）与 dependabot/**（依赖升级）跑 official，
    # 其它来源由下面的 Scaffold Gate 聚合 job fail-closed 拒绝；feature/fix → release 不触发本 workflow。
    types: [opened, synchronize, reopened]
    branches: [master]
  schedule:
    # 每周一 03:00 UTC（北京 11:00）：在默认分支最新提交上跑一次，抓模板/闭包漂移
    - cron: "0 3 * * 1"

# 与 ci.yml 的 `ci-go-<ref>` 分开：本 workflow 的 run 只被同一条重型流水线的新 run 取代，
# 不会被无关的轻量推送取消（取消会丢掉滚动缓存的 save）
concurrency:
  group: ci-scaffold-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 .github/actions/go-setup 的 go-version 默认值保持一致（本文件用自己的 setup-go，
  # 因为它的缓存是 scaffold-gocache、与 CI 分片的滚动缓存不共用）
  GO_VERSION: "1.26.10"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect scaffold inputs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(cmd/|internal/|tools/|bundle\.go$|go\.mod$|go\.sum$|internal/capabilities/.*/migrations/|proto/|configs/|scripts/|Makefile$|docs/templates/v1/|docs/openapi/|\.github/workflows/ci-scaffold\.yml$)'; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          fi

  scaffold-official:
    name: Scaffold (official)
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🏗️ Run official scaffold gate"
        run: make test-scaffold-official

  scaffold-full:
    name: Scaffold (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: capability-build-1, spec: '1/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: capability-build-2, spec: '2/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: capability-build-3, spec: '3/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: capability-build-4, spec: '4/4', test: TestGeneratedProjectBuildsAndVetsForEverySelection }
          - { name: generated-tests-1, spec: '1/2', test: TestGeneratedProjectTestTreeIsGreen }
          - { name: generated-tests-2, spec: '2/2', test: TestGeneratedProjectTestTreeIsGreen }
          - { name: composition-1, spec: '1/2', test: TestRepresentativeCompositionMatrix }
          - { name: composition-2, spec: '2/2', test: TestRepresentativeCompositionMatrix }
          - { name: upgrade-fixtures, spec: '', test: TestUpgradeFixtures }
          - { name: invariants, spec: '', test: '' }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🗂️ Restore the scaffold GOCACHE"
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/scaffold-gocache
          # 滚动 key（full 矩阵在手动/定时运行中使用）：
          #   `-vN`（当前 `-v2`）是**可递增的版本后缀** —— 体积超阈值（见下方守卫）或怀疑缓存内容损坏/被污染时，
          #   递增（-v2、-v3…）后重跑即可强制重建；新 key 必然未命中，旧条目由仓库 actions/cache
          #   配额（10 GB）LRU 淘汰。
          #   末尾的 `${{ github.sha }}` 是关键：Actions 的缓存条目按 key **不可变**，命中即
          #   「只恢复不重存」。旧 key 只含 `hashFiles('go.sum')`，于是快照在首次保存那一刻就冻结，
          #   之后每个 commit 的 first-party 编译产物全部随 runner 丢弃 —— 每次都只有依赖是热的。
          #   带上 sha 后主 key 只在重跑同一 commit 时命中；正常路径是未命中 → 靠 restore-keys 拿
          #   最近一份快照 → 跑完把合并后的目录存成**新**条目，收益才能跨 commit 累积。
          key: scaffold-gocache-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            scaffold-gocache-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            scaffold-gocache-v2-${{ runner.os }}-

      - name: "🏗️ Run full scaffold shard"
        env:
          JIMU_HEAVY_MATRIX: "1"
          JIMU_TEST_GOCACHE: ${{ runner.temp }}/scaffold-gocache
          JIMU_SCAFFOLD_SHARD: ${{ matrix.spec }}
          MATRIX_TEST: ${{ matrix.test }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/scaffold-test.log"
          start=$SECONDS
          set +e
          if [ -n "$MATRIX_TEST" ]; then
            go test ./tools/generator/ -count=1 -timeout 60m -v -run "^$MATRIX_TEST$" 2>&1 | tee "$LOG"
          else
            go test ./tools/generator/ -count=1 -timeout 60m -v -skip '^(TestGeneratedProjectBuildsAndVetsForEverySelection|TestGeneratedProjectTestTreeIsGreen|TestRepresentativeCompositionMatrix|TestUpgradeFixtures)$' 2>&1 | tee "$LOG"
          fi
          status=${PIPESTATUS[0]}
          set -e
          duration=$((SECONDS - start))
          echo "scaffold shard ${{ matrix.name }} duration: ${duration}s"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "| shard | duration |"
              echo "| --- | --- |"
              echo "| ${{ matrix.name }} | ${duration}s |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # fail-closed：显式运行某个测试时，它必须真的 PASS；SKIP 也会被当成门禁失败，
          # 避免 full 矩阵在 CI 里因环境变量缺失而静默跳过。
          if [ -n "$MATRIX_TEST" ] && ! grep -Eq "^--- PASS: $MATRIX_TEST( |$)" "$LOG"; then
            echo "::error::$MATRIX_TEST did not report PASS; the full scaffold gate must not silently skip"
            grep -E "^--- (SKIP|FAIL): $MATRIX_TEST" "$LOG" || true
            exit 1
          fi

      - name: "📏 Report the scaffold GOCACHE size"
        if: always()
        run: |
          CACHE="${{ runner.temp }}/scaffold-gocache"
          du -sh "$CACHE" 2>/dev/null || echo "（缓存目录不存在）"
          SIZE_MB=$(du -sm "$CACHE" 2>/dev/null | cut -f1 || true)
          # 非破坏性守卫：**绝不**在 job 内清空缓存 —— 清空后 actions/cache 的 save 步骤会把**空归档**
          # 写进同一个 key，之后永久命中空缓存、永远冷启动。超阈值只报错退出并给出 bump 指引；
          # 缓存内容的删除交给「bump 版本后缀 + 仓库 10 GB 配额 LRU 淘汰」。
          # 阈值：滚动 key 会真的把每轮的增量存下来，所以这里的体积是**稳态体积**（不再是「只涨在
          # job 内、跑完全丢」的假象），但仍受 Go 自身的 5 天未使用裁剪兜底（cmd/go/internal/cache
          # 的 trimInterval=24h / trimLimit=5d，无大小上限）。
          if [ -n "${SIZE_MB:-}" ] && [ "$SIZE_MB" -gt 6144 ]; then
            echo "::error::scaffold GOCACHE ${SIZE_MB} MB 超过 6 GiB（仓库 actions/cache 配额 10 GB）：请把 ci-scaffold.yml 里 cache key 的版本后缀（当前 -v2）递增后重跑；不要在本 job 内删除缓存内容"
            exit 1
          fi

      # 十个作业均从同一滚动快照恢复；只由一个作业保存，避免写入竞态和缓存配额放大。
      - name: "💾 Save the scaffold GOCACHE"
        if: matrix.name == 'generated-tests-1' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/scaffold-gocache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build-clean-room-cli:
    name: Build Clean-room CLI
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🔎 Verify the template bundle source"
        run: make bundle-check

      - name: "🏗️ Build the Release CLI"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clean-room"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/clean-room/jimu" ./cmd/jimu
          cp scripts/clean_room_e2e.sh "$RUNNER_TEMP/clean-room/clean_room_e2e.sh"
          chmod +x "$RUNNER_TEMP/clean-room/jimu" "$RUNNER_TEMP/clean-room/clean_room_e2e.sh"

      - name: "📤 Upload clean-room assets"
        uses: actions/upload-artifact@v7
        with:
          name: clean-room-cli
          path: ${{ runner.temp }}/clean-room
          if-no-files-found: error
          retention-days: 1

  clean-room:
    name: Clean-room (no checkout)
    needs: [changes, build-clean-room-cli]
    if: needs.changes.outputs.heavy == 'true' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jimu
          MYSQL_USER: jimu
          MYSQL_PASSWORD: jimu
        ports: ["13306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=3s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s --health-timeout=2s --health-retries=30
    steps:
      - name: "📥 Download clean-room assets"
        uses: actions/download-artifact@v8
        with:
          name: clean-room-cli
          path: ${{ runner.temp }}/clean-room

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "🧪 Run clean-room minimal and auth presets"
        run: |
          set -euo pipefail
          script="$(find "$RUNNER_TEMP/clean-room" -type f -name clean_room_e2e.sh -print -quit)"
          test -n "$script"
          chmod +x "$RUNNER_TEMP/clean-room/jimu" "$script"
          JIMU_BIN="$RUNNER_TEMP/clean-room/jimu" \
            WORKDIR="$RUNNER_TEMP/clean-room/work" \
            bash "$script"

  scaffold-matrix:
    name: Scaffold Gate
    needs: [changes, scaffold-official, scaffold-full, build-clean-room-cli, clean-room]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate release gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          OFFICIAL_RESULT: ${{ needs.scaffold-official.result }}
          FULL_RESULT: ${{ needs.scaffold-full.result }}
          BUILD_CLEAN_ROOM_RESULT: ${{ needs.build-clean-room-cli.result }}
          CLEAN_ROOM_RESULT: ${{ needs.clean-room.result }}
          RELEASE_SOURCE: ${{ github.head_ref }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Scaffold input detection failed: $CHANGES_RESULT"
            exit 1
          fi
          # 只接受 release/* 与 dependabot/* 来源的 master PR：前者是发布候选，后者是依赖升级。
          # PR 只跑 official；full 只允许在 schedule/workflow_dispatch 运行。
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [[ "$RELEASE_SOURCE" != release/* && "$RELEASE_SOURCE" != dependabot/* ]]; then
            echo "::error::Scaffold Gate only accepts release/* and dependabot/* -> master PRs: $RELEASE_SOURCE"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ "$HEAVY" = true ] && [ "$OFFICIAL_RESULT" != success ]; then
              echo "::error::official scaffold gate failed or was skipped: $OFFICIAL_RESULT"
              exit 1
            fi
            if [ "$HEAVY" = true ] && [ "$BUILD_CLEAN_ROOM_RESULT" != success ]; then
              echo "::error::clean-room CLI build failed or was skipped: $BUILD_CLEAN_ROOM_RESULT"
              exit 1
            fi
            if [ "$HEAVY" = true ] && [ "$CLEAN_ROOM_RESULT" != success ]; then
              echo "::error::clean-room gate failed or was skipped: $CLEAN_ROOM_RESULT"
              exit 1
            fi
            if [ "$HEAVY" = false ] && [ "$OFFICIAL_RESULT" != skipped ]; then
              echo "::error::official scaffold gate unexpectedly ran: $OFFICIAL_RESULT"
              exit 1
            fi
            if [ "$HEAVY" = false ] && [ "$BUILD_CLEAN_ROOM_RESULT" != skipped ]; then
              echo "::error::clean-room CLI build unexpectedly ran: $BUILD_CLEAN_ROOM_RESULT"
              exit 1
            fi
            if [ "$HEAVY" = false ] && [ "$CLEAN_ROOM_RESULT" != skipped ]; then
              echo "::error::clean-room gate unexpectedly ran: $CLEAN_ROOM_RESULT"
              exit 1
            fi
            if [ "$FULL_RESULT" != skipped ]; then
              echo "::error::full scaffold matrix must not run on pull requests: $FULL_RESULT"
              exit 1
            fi
          else
            if [ "$FULL_RESULT" != success ]; then
              echo "::error::full scaffold matrix failed or was skipped: $FULL_RESULT"
              exit 1
            fi
            if [ "$OFFICIAL_RESULT" != skipped ]; then
              echo "::error::official scaffold gate must not run outside pull requests: $OFFICIAL_RESULT"
              exit 1
            fi
            if [ "$BUILD_CLEAN_ROOM_RESULT" != skipped ] || [ "$CLEAN_ROOM_RESULT" != skipped ]; then
              echo "::error::clean-room gate must not run outside pull requests: build=$BUILD_CLEAN_ROOM_RESULT run=$CLEAN_ROOM_RESULT"
              exit 1
            fi
          fi
