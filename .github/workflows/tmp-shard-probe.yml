name: TMP Shard Probe

# 临时探针：只为回答两个问题（用完即删，不进入正式编排）
#   ① 全量合并分片在 `-race -covermode=atomic` 下的覆盖率 total 与基线 71.1% 的差距
#   ② 14 个分片各自耗时（用于决定 generator 5 片 + composereport 5 片后的配平）
on:
  push:
    branches: [feature/ci-pipeline]

concurrency:
  group: tmp-shard-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 矩阵由脚本派生（与正式编排同一事实源）；shards-json 不需要 Go，故本 job 只 checkout
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - name: Emit the shard matrix
        id: plan
        run: echo "shards=$(bash scripts/test_shards.sh shards-json)" >> "$GITHUB_OUTPUT"

  shards:
    name: Probe (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    services:
      mariadb:
        image: mariadb:12.1.2-noble
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: jimu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jimu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          flavor: shards
      - name: Run the shard with coverage
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: jimu_test
        run: bash scripts/test_shards.sh run ${{ matrix.shard }} --cover
      - name: Upload the profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.shard }}
          path: cover-${{ matrix.shard }}.out
          if-no-files-found: ignore
          retention-days: 1

  merge:
    name: Merge and report
    needs: [plan, shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: probe-*
          merge-multiple: true
          path: cover
      # `go tool cover` 需要 Go 工具链，故本 job 也要装 Go；只需工具链、不需要构建缓存
      - uses: ./.github/actions/go-setup
        with:
          flavor: lint
          cache: "false"
      - name: Merge the profiles and print the total
        run: |
          bash scripts/test_shards.sh merge-cover cover coverage.out
          go tool cover -func=coverage.out | tail -1
