name: Start Release Branch

# 一键开版：总是从 master 创建 release/<version>。
# 依赖升级平时就直接进 master（dependabot 的 PR 面向默认分支），因此发布分支天然包含
# 当时的依赖升级，不需要额外的「吸收」步骤，也不再有「选错起点分支」这个易错点。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（形如 v0.3.7）
        required: true
        type: string

permissions:
  contents: write

jobs:
  start:
    name: Create Release Branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号格式非法（应为 vX.Y.Z）：$VERSION"
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/heads/release/$VERSION" >/dev/null 2>&1; then
            echo "::error::分支 release/$VERSION 已存在"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Create and push the release branch
        run: |
          set -euo pipefail
          git checkout -b "release/${{ inputs.version }}"
          git push origin "release/${{ inputs.version }}"
          echo "✅ created release/${{ inputs.version }} from master"
