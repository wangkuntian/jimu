name: Go setup with rolling build cache
description: 安装 Go、恢复滚动 GOCACHE、并把它导出给后续步骤（CI 各 Go job 的统一入口；Go 版本在此定义一次）

inputs:
  flavor:
    description: 缓存风味（lint / shards / gates），不同风味不共用同一份快照
    required: true
  go-version:
    description: Go 版本（本仓唯一事实源）
    required: false
    default: "1.26.9"
  cache:
    description: 是否启用滚动构建缓存
    required: false
    default: "true"
  save:
    description: >-
      是否保存缓存。**不变量：同一个 flavor 只允许一个 save=true 的调用方**，其余必须传 "false"
      （只恢复）。原因：缓存 key 不可变、保存先到先得 —— 若同一 flavor 有多个保存者，最先结束的
      那个（往往是构建量最小的 job）会写出不完整快照，之后所有 job 只能命中这份残缺快照 ⇒ 每个
      新 commit 上大部分 job 全额重编译（实测分片步骤 7s → 178s、PR 墙钟被抬到 6m51s）。
      破坏该不变量的后果是**静默的性能回归，CI 不会报错**。
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Resolve the cache path
      id: resolve
      shell: bash
      # 缓存目录固定在 runner 的临时目录下，无需调用方指定
      run: echo "path=$RUNNER_TEMP/gocache-${{ inputs.flavor }}" >> "$GITHUB_OUTPUT"

    - name: "♻️ Restore the rolling build cache"
      if: inputs.cache == 'true' && inputs.save == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.resolve.outputs.path }}
        # 主 key 带 sha：Actions 缓存条目按 key 不可变、命中即「只恢复不重存」，
        # 因此主 key 只在重跑同一 commit 时命中，其余靠 restore-keys 拿最近快照、跑完存新条目
        key: gocache-${{ inputs.flavor }}-${{ runner.os }}-${{ hashFiles('go.mod','go.sum') }}-${{ github.sha }}
        restore-keys: |
          gocache-${{ inputs.flavor }}-${{ runner.os }}-${{ hashFiles('go.mod','go.sum') }}-
          gocache-${{ inputs.flavor }}-${{ runner.os }}-

    - name: "♻️ Restore the rolling build cache (restore-only)"
      if: inputs.cache == 'true' && inputs.save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.resolve.outputs.path }}
        # 与保存步骤共用同一组 key/restore-keys（两者的 if 互斥、不会同跑）：只恢复不写回，
        # 避免抢先保存出不完整快照（保存权归该 flavor 的唯一保存者，如 ci.yml 的 warmup job）
        key: gocache-${{ inputs.flavor }}-${{ runner.os }}-${{ hashFiles('go.mod','go.sum') }}-${{ github.sha }}
        restore-keys: |
          gocache-${{ inputs.flavor }}-${{ runner.os }}-${{ hashFiles('go.mod','go.sum') }}-
          gocache-${{ inputs.flavor }}-${{ runner.os }}-

    - name: "🛠️ Point GOCACHE at the rolling build cache"
      if: inputs.cache == 'true'
      shell: bash
      run: echo "GOCACHE=${{ steps.resolve.outputs.path }}" >> "$GITHUB_ENV"
