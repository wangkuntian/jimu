# Air - Live reload for Go apps
# 文档: https://github.com/air-verse/air
# 使用: air 或 make dev

root = "."
tmp_dir = "tmp"

[build]
  # 构建命令
  cmd = "go build -o ./tmp/server ./cmd/server"
  # 二进制文件路径
  bin = "./tmp/server"
  # 传递参数
  args_bin = []
  # 监听的文件扩展名
  include_ext = ["go", "tmpl", "tpl", "html", "yaml"]
  # 排除的目录
  exclude_dir = ["assets", "tmp", "vendor", "deploy", "work", "graphify-out", "docs"]
  # 排除的文件
  exclude_regex = ["_test.go"]
  # 无变化时不重新构建
  exclude_unchanged = true
  # 跟踪符号链接
  follow_symlink = true
  # 完整构建
  full_bin = ""
  # 发送中断信号
  send_interrupt = true
  # 停止超时
  kill_delay = "0.5s"

[log]
  # 显示时间
  time = true
  # 仅显示主日志
  main_only = true

[misc]
  # 退出时清理 tmp 目录
  clean_on_exit = true

[screen]
  # 清屏
  clear_on_rebuild = true
  # 保留滚动
  keep_scroll = true
